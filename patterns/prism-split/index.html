<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism split demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="prism-split.js" defer></script>
</head>
<body>
<main class="stage">
<section class="prism psd" aria-labelledby="psd-h">
  <canvas class="ps-canvas" aria-hidden="true"></canvas>
  <div class="psd-card">
    <p class="psd-name">Optik Teratai <span>Jalan Telawi 3, Bangsar</span></p>
    <h1 id="psd-h">Lenses cut in our own lab, ready in 45 minutes.</h1>
    <ul class="psd-list">
      <li><span>Eye test, 25 minutes</span> <span class="num">RM 35</span></li>
      <li><span>Single vision, anti glare</span> <span class="num">RM 189</span></li>
      <li><span>Progressive, from</span> <span class="num">RM 640</span></li>
    </ul>
    <p class="psd-when">Eye test free with any frame from <span class="num">RM 289</span>. Next slot today, Monday 9 November, <span class="num">4:15 pm</span>.</p>
    <a class="psd-btn" href="#psd-h">Book an eye test</a>
  </div>
  <button type="button" class="ps-pause psd-pause" aria-pressed="false" hidden>Pause</button>
</section>
</main>
</body>
</html>
