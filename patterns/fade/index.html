<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fade demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <article class="trip sheet" aria-labelledby="trip-h">
    <div class="photos">
      <div class="fade-frame ph ph-ridge">
        <svg class="fade-settle" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The ridge at sunset, the sun low over two rows of hills">
          <rect width="320" height="240" fill="#f4c99a"/>
          <rect y="120" width="320" height="120" fill="#efb27f"/>
          <circle cx="226" cy="118" r="26" fill="#fff1dc"/>
          <path d="M0 150 L48 128 L92 140 L150 112 L204 136 L262 120 L320 132 V240 H0Z" fill="#c98a6a"/>
          <path d="M0 178 L60 160 L120 172 L176 150 L240 170 L320 158 V240 H0Z" fill="#8a5b4b"/>
          <path d="M0 240 V206 L70 190 L104 172 L132 186 L170 200 L320 214 V240Z" fill="#3c2c2e"/>
          <path d="M98 176 l3 -9 l3 9 Z M88 182 l2 -6 l2 6Z" fill="#3c2c2e"/>
        </svg>
      </div>
      <div class="fade-frame ph ph-rock">
        <svg class="fade-settle" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pale quartz rock with a painted trail mark">
          <rect width="160" height="120" fill="#d9dccf"/>
          <path d="M0 120 L0 70 L34 40 L82 52 L120 26 L160 44 V120Z" fill="#eef0e8"/>
          <path d="M34 40 L50 120 M82 52 L74 120 M120 26 L128 120" stroke="#c4c8b8" stroke-width="2"/>
          <rect x="88" y="66" width="18" height="10" fill="#e2503c"/>
          <rect x="88" y="78" width="18" height="10" fill="#f6f6f2"/>
        </svg>
      </div>
      <div class="fade-frame ph ph-city">
        <svg class="fade-settle" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The city lights from the summit after dark">
          <rect width="160" height="120" fill="#2b3350"/>
          <rect y="70" width="160" height="50" fill="#1d2338"/>
          <g fill="#ffd58a"><rect x="14" y="80" width="3" height="3"/><rect x="30" y="86" width="3" height="3"/><rect x="48" y="78" width="3" height="3"/><rect x="62" y="90" width="3" height="3"/><rect x="80" y="82" width="3" height="3"/><rect x="96" y="88" width="3" height="3"/><rect x="112" y="80" width="3" height="3"/><rect x="128" y="92" width="3" height="3"/><rect x="144" y="84" width="3" height="3"/><rect x="22" y="96" width="3" height="3"/><rect x="70" y="100" width="3" height="3"/><rect x="120" y="102" width="3" height="3"/></g>
          <rect x="102" y="30" width="4" height="40" fill="#141a2b"/><rect x="100" y="26" width="8" height="6" fill="#141a2b"/>
          <circle cx="40" cy="24" r="7" fill="#e9e6d6"/>
        </svg>
      </div>
    </div>
    <div class="trip-text">
      <h1 id="trip-h">Bukit Tabur, west ridge</h1>
      <p class="trip-meta num">4.2 km, 2 h 10 min, 312 m up</p>
    </div>
    <p class="trip-note">The words are there from the first frame. Each photo fades onto a tint taken from it, so the page never flashes white.</p>
  </article>
</main>
</body>
</html>
