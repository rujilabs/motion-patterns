<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fade · motion-patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">

<body>
<main class="stage">
  <article class="post">
    <div class="fade-frame photo">
      <svg class="fade-settle" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Evening over two hills, the sun low on the right">
        <rect width="400" height="250" fill="#f6d7b0"/>
        <circle cx="292" cy="96" r="34" fill="#f08a4b"/>
        <path d="M0 180 Q100 110 200 165 T400 150 V250 H0Z" fill="#8fbf9a"/>
        <path d="M0 210 Q120 165 250 205 T400 195 V250 H0Z" fill="#3f7a5a"/>
      </svg>
    </div>
    <p class="label">Field notes</p>
    <h1>Walking the ridge before sunset</h1>
    <p class="meta">The title and text are there from the first frame. Only the photo fades, onto a tint that matches it.</p>
  </article>
</main>
</body>
</html>
