<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- The jetty at Pulau Ketam at dusk: a village on stilts over the water. Drawn for the demo, flat shapes and gradients only. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27365a"/>
      <stop offset=".42" stop-color="#7a5a7a"/>
      <stop offset=".72" stop-color="#d9846a"/>
      <stop offset="1" stop-color="#f4b778"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b27a78"/>
      <stop offset=".35" stop-color="#5e5674"/>
      <stop offset="1" stop-color="#1f2742"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a8" stop-opacity=".85"/>
      <stop offset=".4" stop-color="#f7b678" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f4b778" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd793" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd793" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle cx="790" cy="372" r="190" fill="url(#halo)"/>
  <circle cx="790" cy="384" r="38" fill="#ffe0a3"/>

  <!-- clouds, thin and low -->
  <path d="M120 180 h260 a14 14 0 0 1 0 10 h-260 z" fill="#8c6a86" opacity=".55"/>
  <path d="M540 128 h330 a12 12 0 0 1 0 9 h-330 z" fill="#6e5a80" opacity=".5"/>
  <path d="M880 252 h220 a10 10 0 0 1 0 8 h-220 z" fill="#c07f78" opacity=".6"/>

  <!-- the mangrove shore across the strait -->
  <path d="M0 404 q30 -14 60 -6 q24 -16 52 -4 q30 -12 58 0 q22 -10 46 -2 q30 -14 64 -2 q28 -8 50 2 q36 -12 70 0 q30 -10 56 0 q34 -14 70 -2 q26 -8 52 2 q32 -12 66 0 q28 -10 58 0 q30 -14 64 -2 q26 -6 50 4 q34 -12 66 0 q30 -10 60 0 q28 -12 58 -2 q24 -6 50 4 q36 -12 70 -2 v12 h-1200 z" fill="#3c3150"/>

  <!-- water -->
  <rect y="414" width="1200" height="261" fill="url(#sea)"/>
  <!-- the sun on the water: broken strips under it -->
  <g fill="#ffd793">
    <rect x="762" y="424" width="56" height="4" rx="2" opacity=".85"/>
    <rect x="748" y="440" width="84" height="4" rx="2" opacity=".7"/>
    <rect x="770" y="456" width="44" height="3" rx="1.5" opacity=".65"/>
    <rect x="738" y="472" width="96" height="4" rx="2" opacity=".5"/>
    <rect x="776" y="490" width="36" height="3" rx="1.5" opacity=".5"/>
    <rect x="726" y="510" width="120" height="4" rx="2" opacity=".35"/>
    <rect x="760" y="532" width="60" height="3" rx="1.5" opacity=".3"/>
    <rect x="712" y="558" width="150" height="4" rx="2" opacity=".2"/>
  </g>

  <!-- stilt houses, left to right; plank walkway at 470 -->
  <g fill="#2b2238">
    <!-- poles -->
    <rect x="40" y="440" width="5" height="110"/><rect x="96" y="440" width="5" height="114"/><rect x="152" y="440" width="5" height="108"/>
    <rect x="212" y="448" width="5" height="104"/><rect x="268" y="448" width="5" height="110"/><rect x="330" y="452" width="5" height="96"/>
    <rect x="386" y="452" width="5" height="102"/><rect x="440" y="462" width="5" height="92"/><rect x="498" y="462" width="5" height="88"/>
    <rect x="556" y="462" width="5" height="86"/><rect x="612" y="466" width="5" height="76"/>
    <!-- house 1: tall zinc roof -->
    <path d="M14 440 V352 L76 316 L138 352 V440 Z"/>
    <!-- house 2 -->
    <path d="M128 446 V372 L190 340 L252 372 V446 Z"/>
    <!-- house 3: two storey shop -->
    <path d="M244 452 V330 H368 V452 Z"/>
    <path d="M236 334 L306 300 L376 334 Z"/>
    <!-- house 4 -->
    <path d="M366 458 V384 L420 356 L474 384 V458 Z"/>
    <!-- house 5, low -->
    <path d="M466 464 V402 L516 380 L566 402 V464 Z"/>
    <!-- the jetty walkway running out toward the sun -->
    <rect x="0" y="466" width="660" height="9"/>
    <rect x="560" y="458" width="4" height="10"/><rect x="600" y="458" width="4" height="10"/><rect x="640" y="458" width="4" height="10"/>
    <rect x="560" y="458" width="84" height="3"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffcf7a">
    <rect x="40" y="372" width="20" height="24"/><rect x="92" y="372" width="20" height="24" opacity=".55"/>
    <rect x="164" y="390" width="18" height="20"/>
    <rect x="262" y="350" width="18" height="22" opacity=".7"/><rect x="298" y="350" width="18" height="22"/><rect x="334" y="350" width="18" height="22" opacity=".45"/>
    <rect x="262" y="398" width="90" height="34" opacity=".9"/>
    <rect x="404" y="400" width="16" height="20"/>
    <rect x="500" y="418" width="16" height="18" opacity=".6"/>
  </g>
  <!-- the shop's awning and the light it throws on the water -->
  <path d="M252 396 h108 l8 10 h-124 z" fill="#4b3348"/>
  <rect x="262" y="476" width="90" height="70" fill="url(#glow)" opacity=".35"/>
  <rect x="34" y="476" width="30" height="50" fill="url(#glow)" opacity=".3"/>

  <!-- poles in the water reflected as short dark strokes -->
  <g fill="#1a1f35" opacity=".6">
    <rect x="40" y="552" width="5" height="22"/><rect x="152" y="550" width="5" height="18"/><rect x="268" y="560" width="5" height="20"/><rect x="440" y="556" width="5" height="16"/>
  </g>

  <!-- a sampan coming in, one person standing at the stern -->
  <g fill="#1d1a2c">
    <path d="M862 520 h150 q-12 22 -40 24 h-86 q-18 -6 -24 -24 z"/>
    <rect x="976" y="474" width="7" height="46" rx="3"/>
    <circle cx="980" cy="466" r="8"/>
    <path d="M966 486 L1050 548" stroke="#1d1a2c" stroke-width="3"/>
    <path d="M880 512 h50 v8 h-50 z"/>
  </g>
  <path d="M846 548 q90 8 190 0" fill="none" stroke="#f3b97c" stroke-width="2" opacity=".5"/>

  <!-- birds going home -->
  <g fill="none" stroke="#2b2238" stroke-width="2.5" stroke-linecap="round">
    <path d="M610 214 q8 -7 14 0 q6 -7 14 0"/>
    <path d="M650 238 q6 -5 11 0 q5 -5 11 0"/>
    <path d="M582 248 q5 -4 9 0 q4 -4 9 0"/>
  </g>
</svg>
