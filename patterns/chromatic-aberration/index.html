<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromatic aberration demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <section class="shot sheet" aria-labelledby="shot-h">
    <header class="shot-head">
      <div>
        <h1 id="shot-h">Chromatic aberration</h1>
        <p class="shot-sub">A window frame against a bright sky, on a cheap wide lens</p>
      </div>
    </header>
    <div class="frame">
      <svg class="ca-defs" width="0" height="0" aria-hidden="true">
        <defs><g id="ca-scene">
          <rect class="ca-sky" x="0" y="0" width="320" height="200"/>
          <g class="ca-city"><rect x="40" y="96" width="30" height="70"/><rect x="74" y="80" width="22" height="86"/><rect x="100" y="104" width="40" height="62"/><rect x="176" y="88" width="26" height="78"/><rect x="206" y="110" width="44" height="56"/><rect x="254" y="92" width="24" height="74"/></g>
          <rect class="ca-sill" x="0" y="166" width="320" height="34"/>
          <path class="ca-branch" d="M-4 26 C30 30 52 40 74 58 M30 31 C38 18 46 12 58 8 M52 42 C58 30 70 24 84 24 M74 58 C82 60 90 66 96 74"/>
          <g class="ca-bar"><rect x="0" y="0" width="320" height="10"/><rect x="0" y="0" width="12" height="200"/><rect x="308" y="0" width="12" height="200"/><rect x="155" y="0" width="10" height="170"/><rect x="0" y="84" width="320" height="8"/><rect x="0" y="160" width="320" height="10"/></g>
          <rect class="ca-latch" x="146" y="120" width="28" height="6" rx="3"/>
        </g></defs>
      </svg>
      <div class="ca ca-in" data-play role="img" aria-label="A dark window frame with a city and a bare branch outside against a bright sky. Red and blue fringes appear along the dark edges, strongest toward the corners.">
        <div class="ca-ch ca-r"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#ca-scene"/></svg></div>        <div class="ca-ch ca-g"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#ca-scene"/></svg></div>        <div class="ca-ch ca-b"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#ca-scene"/></svg></div>      </div>
      <span class="vf" aria-hidden="true"></span>
    </div>
    <div class="shot-foot">
      <span>Fringes grow toward the corners</span>
      <span class="num">14 mm, wide open</span>
    </div>
  </section>
</main>
</body>
</html>
