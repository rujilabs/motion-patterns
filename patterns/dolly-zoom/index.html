<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolly zoom demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <figure class="shot sheet dolly-zoom-group">
    <div class="frame dolly-zoom" role="img" aria-label="A person stands in a long corridor and stays the same size while the corridor behind them stretches and squeezes">
      <div class="dolly-zoom-layer room">
<svg class="scene" viewBox="0 0 480 300" aria-hidden="true">
<path class="floor" d="M240 150L-240 450H720Z"/>
<path class="line" d="M240 150L-480 -300M240 150L960 -300M240 150L-480 600M240 150L960 600"/>
</svg>
      </div>
      <div class="dolly-zoom-layer d125">
<svg class="scene" viewBox="0 0 480 300" aria-hidden="true"><rect class="grey" x="80" y="50" width="320" height="200"/><rect class="solid" x="227.2" y="52" width="25.6" height="2"/></svg>
      </div>
      <div class="dolly-zoom-layer d16">
<svg class="scene" viewBox="0 0 480 300" aria-hidden="true"><rect class="grey" x="115" y="71.9" width="250" height="156.3"/><rect class="solid" x="230" y="73.9" width="20" height="2"/></svg>
      </div>
      <div class="dolly-zoom-layer d22">
<svg class="scene" viewBox="0 0 480 300" aria-hidden="true"><rect class="grey" x="149.1" y="93.2" width="181.8" height="113.6"/><rect class="solid" x="232.7" y="95.2" width="14.5" height="2"/></svg>
      </div>
      <div class="dolly-zoom-layer d3">
<svg class="scene" viewBox="0 0 480 300" aria-hidden="true"><rect class="grey" x="173.3" y="108.3" width="133.3" height="83.3"/><rect class="solid" x="234.7" y="110.3" width="10.7" height="2"/></svg>
      </div>
      <div class="dolly-zoom-layer d42">
<svg class="scene" viewBox="0 0 480 300" aria-hidden="true"><rect class="grey" x="192.4" y="120.2" width="95.2" height="59.5"/><rect class="solid" x="236.2" y="122.2" width="7.6" height="2"/></svg>
      </div>
      <div class="dolly-zoom-layer d6">
<svg class="scene" viewBox="0 0 480 300" aria-hidden="true"><rect class="ink" x="206.7" y="129.2" width="66.7" height="41.7"/><rect class="soft" x="225.3" y="137.5" width="29.3" height="18.3"/></svg>
      </div>
      <div class="person">
<svg class="scene" viewBox="0 0 480 300" aria-hidden="true">
<circle class="solid" cx="240" cy="160" r="10"/>
<path class="solid" d="M223 180 Q240 172 257 180 L262 236 L252 236 L250 272 L243 272 L241 242 L239 242 L237 272 L230 272 L228 236 L218 236 Z"/>
<path class="key" d="M229 172 H251 V179 H241 L236 200 L231 199 L234 179 H229 Z"/>
</svg>
      </div>
      <span class="vf" aria-hidden="true"></span>
    </div>
    <figcaption class="shot-bar">
      <p><strong>Dolly zoom</strong> <span class="mute">the person holds, the corridor stretches</span></p>
      <label class="dolly-zoom-pause switch"><input type="checkbox"> Pause</label>
    </figcaption>
  </figure>
</main>
</body>
</html>
