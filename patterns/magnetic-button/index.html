<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetic button demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="magnet.js"></script>
</head>
<body>
<main class="stage">
  <section class="cta sheet" aria-labelledby="cta-h">
    <p class="cta-kicker">Open for two projects in January</p>
    <h1 id="cta-h">Have a building that needs a sign system?</h1>
    <p class="cta-sub mute">We plan, draw and install signs for schools, clinics and markets. A first call takes 30 minutes and costs nothing.</p>
    <div class="cta-row">
      <a class="btn btn-main magnet" href="#call"><span class="magnet-label">Book a call</span></a>
      <a class="btn-round magnet" href="#next" aria-label="See our work" data-magnet-max="10" data-magnet-pull=".45" data-magnet-reach="36">
        <svg class="magnet-label" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M4 10 H16 M11 5 L16 10 L11 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
    <p class="cta-note mute">Move the mouse close to either button.</p>
  </section>
</main>
</body>
</html>
