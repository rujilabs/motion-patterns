<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fisheye demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
<script src="fisheye.js" defer></script>
</head>
<body>
<main class="stage">
  <section class="shot sheet fisheye-group" aria-labelledby="shot-h">
    <header class="shot-head">
      <div>
        <h1 id="shot-h">Fisheye</h1>
        <p class="shot-sub">The corner shop, from the kerb, on an 8 mm lens</p>
      </div>
      <label class="switch"><input type="checkbox" data-fisheye-toggle checked> Fisheye</label>
    </header>
    <div class="frame fisheye" role="img" aria-label="A row of three buildings and a shop front drawn over a square grid. The lens bends it: the middle swells toward the viewer and straight lines bow outward toward the edges.">
      <svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" data-fisheye=".7" aria-hidden="true">
        <rect class="fe-sky" x="-20" y="-20" width="360" height="240"/>
        <g class="fe-grid"><line x1="0" y1="0" x2="0" y2="200"/><line x1="20" y1="0" x2="20" y2="200"/><line x1="40" y1="0" x2="40" y2="200"/><line x1="60" y1="0" x2="60" y2="200"/><line x1="80" y1="0" x2="80" y2="200"/><line x1="100" y1="0" x2="100" y2="200"/><line x1="120" y1="0" x2="120" y2="200"/><line x1="140" y1="0" x2="140" y2="200"/><line x1="160" y1="0" x2="160" y2="200"/><line x1="180" y1="0" x2="180" y2="200"/><line x1="200" y1="0" x2="200" y2="200"/><line x1="220" y1="0" x2="220" y2="200"/><line x1="240" y1="0" x2="240" y2="200"/><line x1="260" y1="0" x2="260" y2="200"/><line x1="280" y1="0" x2="280" y2="200"/><line x1="300" y1="0" x2="300" y2="200"/><line x1="320" y1="0" x2="320" y2="200"/><line x1="0" y1="0" x2="320" y2="0"/><line x1="0" y1="20" x2="320" y2="20"/><line x1="0" y1="40" x2="320" y2="40"/><line x1="0" y1="60" x2="320" y2="60"/><line x1="0" y1="80" x2="320" y2="80"/><line x1="0" y1="100" x2="320" y2="100"/><line x1="0" y1="120" x2="320" y2="120"/><line x1="0" y1="140" x2="320" y2="140"/><line x1="0" y1="160" x2="320" y2="160"/><line x1="0" y1="180" x2="320" y2="180"/><line x1="0" y1="200" x2="320" y2="200"/></g>
        <rect class="c-far" x="18" y="40" width="64" height="104"/>
        <rect class="c-mid" x="102" y="20" width="90" height="124"/>
        <rect class="c-far" x="212" y="50" width="68" height="94"/>
        <g class="c-paper"><rect x="26" y="50" width="10" height="12"/><rect x="26" y="70" width="10" height="12"/><rect x="26" y="90" width="10" height="12"/><rect x="26" y="110" width="10" height="12"/><rect x="42" y="50" width="10" height="12"/><rect x="42" y="70" width="10" height="12"/><rect x="42" y="90" width="10" height="12"/><rect x="42" y="110" width="10" height="12"/><rect x="58" y="50" width="10" height="12"/><rect x="58" y="70" width="10" height="12"/><rect x="58" y="90" width="10" height="12"/><rect x="58" y="110" width="10" height="12"/><rect x="112" y="30" width="12" height="12"/><rect x="112" y="48" width="12" height="12"/><rect x="112" y="66" width="12" height="12"/><rect x="112" y="84" width="12" height="12"/><rect x="112" y="102" width="12" height="12"/><rect x="130" y="30" width="12" height="12"/><rect x="130" y="48" width="12" height="12"/><rect x="130" y="66" width="12" height="12"/><rect x="130" y="84" width="12" height="12"/><rect x="130" y="102" width="12" height="12"/><rect x="148" y="30" width="12" height="12"/><rect x="148" y="48" width="12" height="12"/><rect x="148" y="66" width="12" height="12"/><rect x="148" y="84" width="12" height="12"/><rect x="148" y="102" width="12" height="12"/><rect x="166" y="30" width="12" height="12"/><rect x="166" y="48" width="12" height="12"/><rect x="166" y="66" width="12" height="12"/><rect x="166" y="84" width="12" height="12"/><rect x="166" y="102" width="12" height="12"/><rect x="222" y="60" width="10" height="12"/><rect x="222" y="80" width="10" height="12"/><rect x="222" y="100" width="10" height="12"/><rect x="240" y="60" width="10" height="12"/><rect x="240" y="80" width="10" height="12"/><rect x="240" y="100" width="10" height="12"/><rect x="258" y="60" width="10" height="12"/><rect x="258" y="80" width="10" height="12"/><rect x="258" y="100" width="10" height="12"/></g>
        <rect class="c-paper" x="120" y="114" width="54" height="30"/>
        <rect class="c-accent" x="116" y="106" width="62" height="8"/>
        <rect class="c-ink" x="140" y="120" width="14" height="24"/>
        <rect class="c-ground" x="-20" y="144" width="360" height="76"/>
        <line class="fe-kerb" x1="-20" y1="160" x2="340" y2="160"/>
        <line class="fe-lane" x1="-20" y1="182" x2="40" y2="182"/>
        <line class="fe-lane" x1="70" y1="182" x2="130" y2="182"/>
        <line class="fe-lane" x1="160" y1="182" x2="220" y2="182"/>
        <line class="fe-lane" x1="250" y1="182" x2="310" y2="182"/>
        <polyline class="fe-pole" points="296,160 296,96 284,96"/>
        <circle class="c-warm" cx="282" cy="98" r="3"/>
        <circle class="c-red" cx="64" cy="134" r="5"/>
        <rect class="c-red" x="59" y="139" width="10" height="21"/>
      </svg>
      <span class="fisheye-edge" aria-hidden="true"></span>
      <span class="vf" aria-hidden="true"></span>
    </div>
    <div class="shot-foot">
      <span>Straight lines bow outward</span>
      <span class="num">8 mm lens</span>
    </div>
  </section>
</main>
</body>
</html>
