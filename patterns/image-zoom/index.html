<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image zoom on hover demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
</head>
<body>
<main class="stage">
  <section class="journal" aria-labelledby="j-h">
    <header class="j-head">
      <h1 id="j-h">Field notes</h1>
      <p class="mute">Three short reads from the highlands</p>
    </header>
    <ul class="j-grid">
      <li>
        <a class="story zoom-host" href="#ridge">
          <span class="zoom frame">
            <svg class="zoom-media" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <rect width="160" height="120" fill="#f3dcc2"/>
              <circle cx="112" cy="46" r="14" fill="#f7efe2"/>
              <path d="M0 74 L30 52 L52 64 L82 40 L112 62 L136 50 L160 60 V120 H0Z" fill="#9db5b0"/>
              <path d="M0 88 L24 74 L58 86 L90 68 L124 84 L160 74 V120 H0Z" fill="#5f857f"/>
              <path d="M0 102 L40 92 L80 100 L120 90 L160 98 V120 H0Z" fill="#2f5550"/>
            </svg>
          </span>
          <span class="story-kicker">Walk</span>
          <span class="story-title">The ridge before the fog lifts</span>
          <span class="story-meta num">6 min read</span>
        </a>
      </li>
      <li>
        <a class="story zoom-host" href="#tea">
          <span class="zoom frame">
            <svg class="zoom-media" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <rect width="160" height="120" fill="#e5e9e1"/>
              <rect y="78" width="160" height="42" fill="#b99a76"/>
              <path d="M0 78 H160" stroke="#a08260" stroke-width="1"/>
              <ellipse cx="80" cy="88" rx="34" ry="6" fill="#a08260"/>
              <path d="M54 50 H106 L100 84 Q80 90 60 84Z" fill="#f7f4ee"/>
              <path d="M106 58 Q122 60 118 70 Q114 78 102 76" fill="none" stroke="#f7f4ee" stroke-width="5"/>
              <ellipse cx="80" cy="50" rx="26" ry="4" fill="#8a5a33"/>
              <path d="M72 40 Q68 32 74 26 M84 40 Q80 30 86 22" fill="none" stroke="#c9cfc4" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="story-kicker">Taste</span>
          <span class="story-title">A cup at the estate kitchen</span>
          <span class="story-meta num">4 min read</span>
        </a>
      </li>
      <li>
        <a class="story zoom-host" href="#town">
          <span class="zoom frame">
            <svg class="zoom-media" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <rect width="160" height="120" fill="#dfe7ef"/>
              <path d="M0 40 H40 V30 H44 V40 H54 V120 H0Z" fill="#e8b98f"/>
              <path d="M54 34 H104 V120 H54Z" fill="#7da0b8"/>
              <path d="M104 44 H160 V120 H104Z" fill="#d78f73"/>
              <g fill="#f4efe6">
                <rect x="8" y="50" width="12" height="16"/><rect x="28" y="50" width="12" height="16"/>
                <rect x="62" y="44" width="12" height="16"/><rect x="84" y="44" width="12" height="16"/>
                <rect x="112" y="54" width="12" height="16"/><rect x="136" y="54" width="12" height="16"/>
              </g>
              <path d="M0 82 H160 V90 H0Z" fill="#c95b45"/>
              <g fill="#3b4350"><rect x="10" y="94" width="16" height="26"/><rect x="70" y="94" width="18" height="26"/><rect x="122" y="94" width="16" height="26"/></g>
            </svg>
          </span>
          <span class="story-kicker">Town</span>
          <span class="story-title">Shophouses on the old main road</span>
          <span class="story-meta num">8 min read</span>
        </a>
      </li>
    </ul>
  </section>
</main>
</body>
</html>
