<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop-motion demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <article class="event sheet stop-group" aria-labelledby="ev-h">
    <div class="scene" aria-hidden="true">
      <span class="sun"></span>
      <span class="block b1"></span><span class="block b2"></span><span class="block b3"></span><span class="block b4"></span>
      <p class="banner stop-boil">Paper City</p>
      <span class="road"></span>
      <div class="bus stop-cross">
        <svg class="stop-boil" viewBox="0 0 120 56" width="120" height="56">
          <path class="bus-shell" d="M3 44V10.5L6 6h104l5 6v32Z"/>
          <g class="bus-win"><rect x="12" y="13" width="16" height="13"/><rect x="33" y="13" width="16" height="13"/><rect x="54" y="13" width="16" height="13"/><rect x="75" y="13" width="16" height="13"/><path d="M98 13h10l3 4v9H98Z"/></g>
          <path class="bus-band" d="M3 31h112v4H3Z"/>
          <g class="stop-spin"><circle cx="26" cy="45" r="9" class="tyre"/><path d="M26 38v14M19 45h14" class="spoke"/></g>
          <g class="stop-spin"><circle cx="94" cy="45" r="9" class="tyre"/><path d="M94 38v14M87 45h14" class="spoke"/></g>
        </svg>
      </div>
    </div>
    <div class="ev-body">
      <p class="ev-kicker">Saturday workshop</p>
      <h1 id="ev-h">Make a paper city move</h1>
      <p class="ev-sub">Cut, place, photograph, repeat. Ages 9 to 12, two hours, all materials ready.</p>
      <div class="ev-foot">
        <p class="num ev-when">25 Oct, 10:00</p>
        <div class="toggles">
          <label class="stop-smooth switch"><input type="checkbox"> Smooth</label>
          <label class="stop-pause switch"><input type="checkbox"> Pause</label>
        </div>
      </div>
    </div>
  </article>
</main>
</body>
</html>
