<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass icons demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="glass-icons.js" defer></script>
<script src="demo.js" defer></script>
</head>
<body>
<main class="stage">
  <section class="gl" aria-labelledby="gl-h">
    <header class="gl-head">
      <div>
        <p class="gl-kicker">No. 23, Jalan Setia Murni, Setia Alam</p>
        <h1 id="gl-h">Downstairs</h1>
      </div>
      <p class="gl-clock num">Mon 7:52 pm</p>
    </header>

    <div class="gl-grid" id="gl-grid">
      <button class="glass-icon gl-lamp" type="button" aria-pressed="true" data-kw="0.018" data-on-text="Warm, 70%">
        <span class="glass-art" aria-hidden="true"><span class="glass-plate"></span><span class="glass-pane">
          <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
        </span></span>
        <span class="gl-name">Living room lamp</span><span class="gl-state" aria-hidden="true">Warm, 70%</span>
      </button>
      <button class="glass-icon gl-fan" type="button" aria-pressed="true" data-kw="0.075" data-on-text="Speed 3">
        <span class="glass-art" aria-hidden="true"><span class="glass-plate"></span><span class="glass-pane">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.8"/><path d="M12 10.2C11 6 12.5 3.4 15 3.6c2 .2 2 3-3 6.6zM13.6 12.9c3.2 2.9 3.4 5.9 1.3 7.1-1.8 1-3.6-1.2-1.3-7.1zM10.4 12.6C6.3 13.9 3.7 12.5 3.8 10.1c.1-2 2.9-2.3 6.6 2.5z"/></svg>
        </span></span>
        <span class="gl-name">Ceiling fan</span><span class="gl-state" aria-hidden="true">Speed 3</span>
      </button>
      <button class="glass-icon gl-cool" type="button" aria-pressed="true" data-kw="0.92" data-on-text="Cool, 24°C">
        <span class="glass-art" aria-hidden="true"><span class="glass-plate"></span><span class="glass-pane">
          <svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 6.5l2.5-2M9.5 19.5 12 17.5l2.5 2"/></svg>
        </span></span>
        <span class="gl-name">Bedroom aircond</span><span class="gl-state" aria-hidden="true">Cool, 24°C</span>
      </button>
      <button class="glass-icon gl-heat" type="button" aria-pressed="false" data-kw="3.6" data-on-text="Heating">
        <span class="glass-art" aria-hidden="true"><span class="glass-plate"></span><span class="glass-pane">
          <svg viewBox="0 0 24 24"><path d="M12 3.5c3 3.6 5.5 6.6 5.5 10a5.5 5.5 0 0 1-11 0c0-3.4 2.5-6.4 5.5-10z"/><path d="M9.6 14.2a2.4 2.4 0 0 0 2.4 2.4"/></svg>
        </span></span>
        <span class="gl-name">Water heater</span><span class="gl-state" aria-hidden="true">Off</span>
      </button>
      <button class="glass-icon gl-porch" type="button" aria-pressed="false" data-kw="0.012" data-on-text="Till 11:30 pm">
        <span class="glass-art" aria-hidden="true"><span class="glass-plate"></span><span class="glass-pane">
          <svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7M6 9.5V20h12V9.5M10.5 20v-5h3v5"/></svg>
        </span></span>
        <span class="gl-name">Porch light</span><span class="gl-state" aria-hidden="true">Off</span>
      </button>
      <button class="glass-icon gl-water" type="button" aria-pressed="false" data-kw="0.045" data-on-text="12 min">
        <span class="glass-art" aria-hidden="true"><span class="glass-plate"></span><span class="glass-pane">
          <svg viewBox="0 0 24 24"><path d="M12 20v-7M12 13c-3.4 0-5.5-2.2-5.5-5.5 3.4 0 5.5 2.1 5.5 5.5zM12 13c0-3.4 2.1-5.5 5.5-5.5 0 3.3-2.1 5.5-5.5 5.5zM6 20h12"/></svg>
        </span></span>
        <span class="gl-name">Garden sprinkler</span><span class="gl-state" aria-hidden="true">Off</span>
      </button>
    </div>

    <footer class="gl-foot">
      <p><span class="num" id="gl-count">3 of 6 on</span><span aria-hidden="true"> · </span>using <b class="num" id="gl-total">1.01 kW</b></p>
      <p class="vh" id="gl-say" role="status"></p>
    </footer>
  </section>
</main>
</body>
</html>
