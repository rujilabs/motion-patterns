<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiggle demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <section class="desk sheet wiggle-group" aria-labelledby="desk-h">
    <header class="bar">
      <p class="brand">Pasar Kecil <span>seller desk</span></p>
      <div class="tools">
        <button class="tool" type="button" aria-label="Notifications, 3 new">
          <svg class="wiggle" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3.5a5 5 0 0 0-5 5v3.2c0 1-.4 2-1.1 2.7L5 15.5h14l-.9-1.1a3.9 3.9 0 0 1-1.1-2.7V8.5a5 5 0 0 0-5-5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 18a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12 2v1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span class="dot num">3</span>
        </button>
        <button class="tool tool-cart" type="button" aria-label="Basket of returns, 1 item">
          <svg class="wiggle-hover" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 4.5h2.2l2.1 10h10.4l1.8-7.2H6.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="9" cy="18.6" r="1.4" fill="currentColor"/><circle cx="16" cy="18.6" r="1.4" fill="currentColor"/></svg>
        </button>
        <span class="avatar" aria-hidden="true">NA</span>
      </div>
    </header>
    <div class="body">
      <h1 id="desk-h">Three new orders since 9:00</h1>
      <ul class="orders">
        <li><span class="ord num">#2081</span><span class="who">Farah Idris</span><span class="amt num">RM 64.00</span></li>
        <li><span class="ord num">#2080</span><span class="who">Daniel Ong</span><span class="amt num">RM 129.50</span></li>
        <li><span class="ord num">#2079</span><span class="who">Meera Pillai</span><span class="amt num">RM 38.00</span></li>
      </ul>
    </div>
    <footer class="foot">
      <p class="hint">The bell rings every 4 seconds. Point at the basket to rock it.</p>
      <label class="wiggle-pause switch"><input type="checkbox"> Pause</label>
    </footer>
  </section>
</main>
</body>
</html>
