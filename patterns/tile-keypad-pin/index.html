<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile keypad PIN demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
<script src="tile-keypad-pin.js" defer></script>
<script src="demo.js" defer></script>
</head>
<body>
<main class="stage">
  <section class="bank sheet" aria-labelledby="pin-h">
    <div class="transfer">
      <p class="brand">Bank Seroja</p>
      <p class="mute step">Confirm transfer</p>
      <p class="amount num">RM 1,250.00</p>
      <dl class="detail">
        <div><dt>To</dt><dd>Tan Mei Ling</dd></div>
        <div><dt>Account</dt><dd class="num">Savings, ending 4471</dd></div>
        <div><dt>Reference</dt><dd>Rent, November</dd></div>
        <div><dt>From</dt><dd class="num">Current, ending 0832</dd></div>
      </dl>
      <p class="hint mute">For this demo the PIN is <span class="num">240619</span>. Anything else is wrong.</p>
    </div>

    <div class="pin-pad" id="pad" data-length="6" data-status="pin-status">
      <h1 id="pin-h" class="pin-title">Enter your 6-digit PIN</h1>
      <div class="pin-dots" role="img" aria-label="PIN, 0 of 6 digits entered"></div>
      <div class="pin-keys" role="group" aria-label="PIN keypad">
        <button type="button" class="pin-key" data-key="1">1</button>
        <button type="button" class="pin-key" data-key="2">2</button>
        <button type="button" class="pin-key" data-key="3">3</button>
        <button type="button" class="pin-key" data-key="4">4</button>
        <button type="button" class="pin-key" data-key="5">5</button>
        <button type="button" class="pin-key" data-key="6">6</button>
        <button type="button" class="pin-key" data-key="7">7</button>
        <button type="button" class="pin-key" data-key="8">8</button>
        <button type="button" class="pin-key" data-key="9">9</button>
        <span class="pin-blank" aria-hidden="true"></span>
        <button type="button" class="pin-key" data-key="0">0</button>
        <button type="button" class="pin-key" data-key="del" aria-label="Delete last digit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg></button>
      </div>
      <p class="pin-status" id="pin-status" role="status">3 tries left</p>
      <button type="button" class="again" id="again" hidden>Start again</button>
    </div>
  </section>
</main>
</body>
</html>
