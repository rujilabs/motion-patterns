<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolly in demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <figure class="shot sheet dolly-in-group">

<path class="line" d="M-200 168 C -60 140, 60 150, 160 160 S 380 138, 680 158"/>
<path class="soft" d="M-240 190 C -80 160, 40 176, 130 182 S 330 150, 460 176 S 620 168, 720 180 L720 240 L-240 240 Z"/>
</svg>
      </div>
      <div class="dolly-layer mid">
<svg class="scene" viewBox="0 0 480 300" aria-hidden="true">
<rect class="ink" x="-400" y="228" width="1280" height="200"/>
<path class="edge" d="M-400 228H880"/>
<circle class="soft" cx="146" cy="180" r="24"/><path class="edge" d="M146 204V228"/>
<circle class="soft" cx="338" cy="190" r="18"/><path class="edge" d="M338 208V228"/>
<rect class="ink" x="268" y="134" width="10" height="20"/>
<rect class="ink" x="200" y="168" width="90" height="60"/>

<path class="edge" d="M40 228V216"/><path class="edge" d="M60 228V216"/><path class="edge" d="M80 228V216"/><path class="edge" d="M100 228V216"/><path class="edge" d="M120 228V216"/><path class="edge" d="M140 228V216"/><path class="edge" d="M160 228V216"/><path class="edge" d="M180 228V216"/><path class="edge" d="M310 228V216"/><path class="edge" d="M330 228V216"/><path class="edge" d="M350 228V216"/><path class="edge" d="M370 228V216"/><path class="edge" d="M390 228V216"/><path class="edge" d="M410 228V216"/><path class="edge" d="M430 228V216"/><path class="edge" d="M450 228V216"/><path class="line" d="M40 220H180M310 220H450"/>
</svg>
      </div>
      <div class="dolly-layer near">
<svg class="scene" viewBox="0 0 480 300" aria-hidden="true">
<rect class="ink" x="12" y="20" width="24" height="300"/>
<circle class="soft" cx="22" cy="-6" r="66"/>
<rect class="ink" x="440" y="36" width="22" height="300"/>
<circle class="soft" cx="452" cy="10" r="56"/>
<path class="grey" d="M60 292l4 -10l3 8l4 -12l3 14"/><path class="grey" d="M112 292l4 -10l3 8l4 -12l3 14"/><path class="grey" d="M168 292l4 -10l3 8l4 -12l3 14"/><path class="grey" d="M320 292l4 -10l3 8l4 -12l3 14"/><path class="grey" d="M372 292l4 -10l3 8l4 -12l3 14"/><path class="grey" d="M410 292l4 -10l3 8l4 -12l3 14"/>
</svg>
      </div>
      <span class="vf" aria-hidden="true"></span>
    </div>
    <figcaption class="shot-bar">
      <p><strong>Dolly in</strong> <span class="mute">toward the cabin door, past the trees</span></p>
      <label class="dolly-in-pause switch"><input type="checkbox"> Pause</label>
    </figcaption>
  </figure>
</main>
</body>
</html>
