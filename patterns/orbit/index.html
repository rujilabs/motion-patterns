<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <figure class="shot sheet orbit-group">
    <div class="frame orbit" role="img" aria-label="A small sculpture on a plinth in a gallery; the camera arcs around it from one side to the other">
      <div class="orbit-rig">
        <div class="floor"></div>
        <div class="box plinth"><i class="f fr"></i><i class="f bk"></i><i class="f lf"></i><i class="f rt"></i><i class="f tp"></i><i class="f bt"></i></div>
        <div class="box piece"><i class="f fr"></i><i class="f bk"></i><i class="f lf"></i><i class="f rt"></i><i class="f tp"></i><i class="f bt"></i></div>
        <div class="box post p1"><i class="f fr"></i><i class="f bk"></i><i class="f lf"></i><i class="f rt"></i><i class="f tp"></i><i class="f bt"></i></div>
        <div class="box post p2"><i class="f fr"></i><i class="f bk"></i><i class="f lf"></i><i class="f rt"></i><i class="f tp"></i><i class="f bt"></i></div>
        <div class="box post p3"><i class="f fr"></i><i class="f bk"></i><i class="f lf"></i><i class="f rt"></i><i class="f tp"></i><i class="f bt"></i></div>
        <div class="box post p4"><i class="f fr"></i><i class="f bk"></i><i class="f lf"></i><i class="f rt"></i><i class="f tp"></i><i class="f bt"></i></div>
      </div>
      <span class="vf" aria-hidden="true"></span>
    </div>
    <figcaption class="shot-bar">
      <p><strong>Orbit</strong> <span class="mute">an arc around the plinth</span></p>
      <label class="orbit-pause switch"><input type="checkbox"> Pause</label>
    </figcaption>
  </figure>
</main>
</body>
</html>
