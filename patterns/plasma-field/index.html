<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plasma field demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="plasma-field.js" defer></script>
</head>
<body>
<main class="stage">
<section class="plasma pfd" aria-labelledby="pfd-h" data-pf-pitch="7">
  <canvas class="pf-canvas" aria-hidden="true"></canvas>
  <div class="pfd-card">
    <p class="pfd-name">Markas Respawn <span>Level 2, Bangi Sentral</span></p>
    <h1 id="pfd-h">48 rigs, 240 Hz, open till 4:00 am on weekends.</h1>
    <table class="pfd-hours">
      <caption>Opening hours</caption>
      <tbody>
        <tr><th scope="row">Mon to Thu</th><td class="num">2:00 pm to 2:00 am</td></tr>
        <tr><th scope="row">Friday</th><td class="num">2:00 pm to 4:00 am</td></tr>
        <tr><th scope="row">Saturday</th><td class="num">11:00 am to 4:00 am</td></tr>
        <tr><th scope="row">Sunday</th><td class="num">11:00 am to 1:00 am</td></tr>
      </tbody>
    </table>
    <p class="pfd-rate"><span class="num">RM 4.50</span> an hour, pro room <span class="num">RM 7.90</span>. House cup Friday 13 November, <span class="num">9:30 pm</span>.</p>
    <a class="pfd-btn" href="#pfd-h">Book a rig</a>
  </div>
  <button type="button" class="pf-pause pfd-pause" aria-pressed="false" hidden>Pause</button>
</section>
</main>
</body>
</html>
