<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dome gallery demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="dome-gallery.js" defer></script>
</head>
<body>
<main class="stage">
<section class="frame dgd-frame" aria-labelledby="dgd-h">
  <div class="dg" tabindex="0" role="group" aria-roledescription="dome gallery" aria-label="Hall 2. Drag or use the arrow keys to turn, Enter opens the work in front of you." data-dg-cols="10" data-dg-pitch="12 -16">
    <div class="dg-sphere">
      <figure class="dg-tile" data-dg-note="Gold thread on silk, 184 by 92 cm. Gift of the Wan Ismail family."><img src="art/songket.svg" alt="Kain songket, Kuala Terengganu, 1932" width="100" height="120"><figcaption><b>Kain songket</b> <span class="num">Kuala Terengganu, 1932</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Warp ikat on cotton, tied by one weaver over 7 months."><img src="art/puakumbu.svg" alt="Pua kumbu, Saribas, 1958" width="100" height="120"><figcaption><b>Pua kumbu</b> <span class="num">Saribas, 1958</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Hand-drawn wax on cotton, two dye baths."><img src="art/batik.svg" alt="Batik sarong, Kelantan, 1971" width="100" height="120"><figcaption><b>Batik sarong</b> <span class="num">Kelantan, 1971</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Gilt thread couched over card on velvet."><img src="art/tekat.svg" alt="Tekat cushion face, Perak, 1904" width="100" height="120"><figcaption><b>Tekat cushion face</b> <span class="num">Perak, 1904</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Bamboo frame and cut paper, 2.1 m wing to wing."><img src="art/wau.svg" alt="Wau bulan, Bachok, 1986" width="100" height="120"><figcaption><b>Wau bulan</b> <span class="num">Bachok, 1986</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Ink and wash on paper, from a smith's notebook."><img src="art/keris.svg" alt="Keris sheath study, Pahang, 1890" width="100" height="120"><figcaption><b>Keris sheath study</b> <span class="num">Pahang, 1890</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Pandan strips dyed with mangrove bark and indigo."><img src="art/mengkuang.svg" alt="Mengkuang mat, Johor, 1963" width="100" height="120"><figcaption><b>Mengkuang mat</b> <span class="num">Johor, 1963</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Riverbank clay, burnished, then smoked in rice husk."><img src="art/labu.svg" alt="Labu sayong, Kuala Kangsar, 1949" width="100" height="120"><figcaption><b>Labu sayong</b> <span class="num">Kuala Kangsar, 1949</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Silver thread on silk, worn at a royal wedding."><img src="art/songket.svg" alt="Songket shoulder cloth, Pahang, 1927" class="tone-b" width="100" height="120"><figcaption><b>Songket shoulder cloth</b> <span class="num">Pahang, 1927</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Copper block stamps, repeated 312 times."><img src="art/batik.svg" alt="Batik block print, Terengganu, 1966" class="tone-b" width="100" height="120"><figcaption><b>Batik block print</b> <span class="num">Terengganu, 1966</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Crocodile and tree motifs, natural dyes."><img src="art/puakumbu.svg" alt="Pua kumbu, Rejang, 1974" class="tone-b" width="100" height="120"><figcaption><b>Pua kumbu</b> <span class="num">Rejang, 1974</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="A cat-shaped kite with a hummer bow."><img src="art/wau.svg" alt="Wau kucing, Kelantan, 1979" class="tone-b" width="100" height="120"><figcaption><b>Wau kucing</b> <span class="num">Kelantan, 1979</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Made for a bersanding, used three generations."><img src="art/tekat.svg" alt="Tekat wedding fan, Perak, 1911" class="tone-c" width="100" height="120"><figcaption><b>Tekat wedding fan</b> <span class="num">Perak, 1911</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Folded and plaited, no stitching at all."><img src="art/mengkuang.svg" alt="Mengkuang pouch, Melaka, 1955" class="tone-b" width="100" height="120"><figcaption><b>Mengkuang pouch</b> <span class="num">Melaka, 1955</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="A rare glazed piece from a short-lived kiln."><img src="art/labu.svg" alt="Labu sayong, glazed, Kuala Kangsar, 1968" class="tone-b" width="100" height="120"><figcaption><b>Labu sayong, glazed</b> <span class="num">Kuala Kangsar, 1968</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Graphite on paper, three views of one hilt."><img src="art/keris.svg" alt="Keris hilt drawing, Johor, 1902" class="tone-b" width="100" height="120"><figcaption><b>Keris hilt drawing</b> <span class="num">Johor, 1902</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Canting work, 41 colours of wax resist."><img src="art/batik.svg" alt="Batik tulis, Kelantan, 1984" class="tone-c" width="100" height="120"><figcaption><b>Batik tulis</b> <span class="num">Kelantan, 1984</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Worn over trousers, gold on deep green silk."><img src="art/songket.svg" alt="Songket sampin, Terengganu, 1938" class="tone-c" width="100" height="120"><figcaption><b>Songket sampin</b> <span class="num">Terengganu, 1938</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="Lattice wings, flown at the 1991 kite festival."><img src="art/wau.svg" alt="Wau jala budi, Pattani route, 1991" class="tone-c" width="100" height="120"><figcaption><b>Wau jala budi</b> <span class="num">Pattani route, 1991</span></figcaption></figure>
      <figure class="dg-tile" data-dg-note="A ceremonial cloth for receiving guests."><img src="art/puakumbu.svg" alt="Pua kumbu, Baleh, 1969" class="tone-c" width="100" height="120"><figcaption><b>Pua kumbu</b> <span class="num">Baleh, 1969</span></figcaption></figure>
    </div>
  </div>
  <header class="dgd-top">
    <p class="dgd-kicker">Muzium Tenun Kecil, Kuala Terengganu</p>
    <h1 id="dgd-h">Hall 2, the dome</h1>
  </header>
  <p class="dgd-status" aria-live="polite" data-dg-status>20 works from 1890 to 1991.</p>
  <div class="dg-open" role="dialog" aria-modal="true" aria-label="Opened work" hidden>
    <div class="dgd-sheet">
      <span class="dgd-mat"><img src="art/songket.svg" alt="" width="100" height="120"></span>
      <div class="dgd-sheet-text">
        <p class="dgd-sheet-cap" data-dg-caption></p>
        <p class="dgd-sheet-note" data-dg-note></p>
        <button class="dgd-close" type="button" data-dg-close>Back to the dome</button>
      </div>
    </div>
  </div>
</section>
</main>
</body>
</html>
