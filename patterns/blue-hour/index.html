<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue hour demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <figure class="shot sheet" data-play>
    <div class="frame look-blue" role="img" aria-label="The same small square after sunset; the sky and the houses cool to deep blue, then the windows and the street lamp switch on one by one in warm light">
        <svg class="street" viewBox="0 0 320 240" aria-hidden="true">
          <rect width="320" height="177" fill="#cddcea"/>
          <g fill="#ece7de" stroke="#8d877d" stroke-width="1">
            <path d="M112 176 V 112 L 146 92 L 180 112 V 176 Z"/>
            <path d="M180 176 V 106 H 240 V 176 Z M180 112 H 240"/>
            <path d="M240 176 V 116 L 274 96 L 308 116 V 176 Z"/>
          </g>
          <g fill="#aebccb" stroke="#8d877d" stroke-width="1">
            <rect x="124" y="120" width="12" height="16"/><rect x="156" y="120" width="12" height="16"/>
            <rect x="124" y="146" width="12" height="16"/><rect x="156" y="146" width="12" height="16"/>
            <rect x="190" y="120" width="14" height="14"/><rect x="216" y="120" width="14" height="14"/>
            <rect x="190" y="144" width="14" height="14"/><rect x="216" y="144" width="14" height="14"/>
            <rect x="252" y="124" width="12" height="16"/><rect x="284" y="124" width="12" height="16"/>
            <rect x="252" y="150" width="12" height="16"/><rect x="284" y="150" width="12" height="16"/>
          </g>
          <rect y="176" width="320" height="64" fill="#ddd8ce"/>
          <path d="M0 176.5 H 320 M0 226.5 H 320" stroke="#a49e94" stroke-width="1"/>
          <rect x="69" y="146" width="2" height="66" fill="#4d5059"/>
          <path d="M63 147 H 77 L 74 140 H 66 Z" fill="#4d5059"/>
          <path d="M134 212 L 136 191 Q 140 186 144 191 L 146 212 Z" fill="#5a6170"/>
          <circle cx="140" cy="182" r="5" fill="#5a6170"/>
          <path d="M176 202 H 208 V 205 H 176 Z M179 205 V 212 M205 205 V 212" fill="#4d5059" stroke="#4d5059" stroke-width="1.5"/>
          <rect x="228" y="166" width="4" height="46" fill="#6e6255"/>
          <circle cx="230" cy="154" r="21" fill="#a6b9a1" stroke="#7d9479" stroke-width="1"/>
        </svg>
        <svg class="look-blue-light" viewBox="0 0 320 240" aria-hidden="true">
          <defs>
            <radialGradient id="lamp-glow">
              <stop offset="0" stop-color="#ffe2a8" stop-opacity=".95"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g fill="#ffd486">
            <rect class="look-blue-on l1" x="124" y="146" width="12" height="16"/>
            <rect class="look-blue-on l2" x="216" y="120" width="14" height="14"/>
            <rect class="look-blue-on l3" x="284" y="150" width="12" height="16"/>
            <rect class="look-blue-on l4" x="156" y="120" width="12" height="16"/>
            <rect class="look-blue-on l5" x="190" y="144" width="14" height="14"/>
            <rect class="look-blue-on l6" x="252" y="124" width="12" height="16"/>
            <rect class="look-blue-on l7" x="156" y="146" width="12" height="16"/>
          </g>
          <g class="look-blue-on l0">
            <circle cx="70" cy="150" r="26" fill="url(#lamp-glow)"/>
            <path d="M64 147 H 76 L 74 143 H 66 Z" fill="#fff0cc"/>
          </g>
        </svg>
    </div>
    <figcaption class="shot-bar">
      <p><strong>Blue hour</strong> <span class="mute">after sunset: the sky cools, the windows come on</span></p>
      <span class="shot-end"><span class="time num">19:20 to 19:45</span></span>
    </figcaption>
  </figure>
</main>
</body>
</html>
