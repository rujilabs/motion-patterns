            <path d="M0 152h320" stroke="#b5ad9f" stroke-width="2"/>
            <path d="M0 170h320" stroke="#b5ad9f" stroke-width="1"/>
          </svg>
        </figure>
      </div>
    </div>
    <div class="reel-foot">
      <div>
        <h1 id="wp-h">Three doors on Lorong Tiga</h1>
        <p class="reel-sub">Bread, flowers, books. The camera whips between them.</p>

      <label class="whip-pause switch"><input type="checkbox"> Pause</label>

</main>

</html>
