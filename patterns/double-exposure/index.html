<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double exposure demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <figure class="shot sheet" data-play>
    <div class="frame look-double" role="img" aria-label="A head and shoulders profile in dark silhouette on a pale ground; a second exposure of hills, pines and a city skyline fades in and shows only inside the silhouette">
      <img src="profile.svg" alt="" width="320" height="240">
      <img class="look-double-second" src="landscape.svg" alt="" width="320" height="240">
    </div>
    <figcaption class="shot-bar">
      <p><strong>Double exposure</strong> <span class="mute">a landscape inside a profile</span></p>
      <span class="shot-end"><span class="mute num">2 frames</span></span>
    </figcaption>
  </figure>
</main>
</body>
</html>
