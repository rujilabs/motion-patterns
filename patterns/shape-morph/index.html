<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shape morph demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="morph.js"></script>
</head>
<body>
<main class="stage">
  <section class="player sheet" aria-labelledby="ep-h">
    <div class="art" aria-hidden="true">
      <span class="morph-shape blob"></span>
      <span class="morph-shape blob blob-2"></span>
    </div>
    <div class="meta">
      <p class="show">Pasar Malam Radio</p>
      <h1 id="ep-h">Ep. 12: The night shift at the market</h1>
    </div>
    <div class="progress" aria-hidden="true"><span class="progress-fill"></span></div>
    <p class="times num" aria-hidden="true"><span>14:02</span><span>-24:18</span></p>
    <div class="controls">
      <button class="skip" type="button" aria-label="Back 15 seconds">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9l5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 9H14a5.5 5.5 0 1 1-5.2 7.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="play" type="button" data-morph aria-pressed="true" aria-label="Play"><span class="morph-icon"></span></button>
      <button class="skip" type="button" aria-label="Forward 30 seconds">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 5 5 4-5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 9H10a5.5 5.5 0 1 0 5.2 7.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </section>
</main>
</body>
</html>
