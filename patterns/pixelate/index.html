<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixelate demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="pixelate.js"></script>
</head>
<body>
<!-- the block filters the pattern uses: one per block size (5, 9, 15, 23, 33 px) -->
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="px-5" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feFlood x="2" y="2" width="1" height="1" result="dot"/>
      <feComposite in="dot" in2="dot" operator="over" x="0" y="0" width="5" height="5" result="cell"/>
      <feTile in="cell" result="grid"/>
      <feComposite in="SourceGraphic" in2="grid" operator="in"/>
      <feMorphology operator="dilate" radius="2"/>
    </filter>
    <filter id="px-9" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feFlood x="4" y="4" width="1" height="1" result="dot"/>
      <feComposite in="dot" in2="dot" operator="over" x="0" y="0" width="9" height="9" result="cell"/>
      <feTile in="cell" result="grid"/>
      <feComposite in="SourceGraphic" in2="grid" operator="in"/>
      <feMorphology operator="dilate" radius="4"/>
    </filter>
    <filter id="px-15" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feFlood x="7" y="7" width="1" height="1" result="dot"/>
      <feComposite in="dot" in2="dot" operator="over" x="0" y="0" width="15" height="15" result="cell"/>
      <feTile in="cell" result="grid"/>
      <feComposite in="SourceGraphic" in2="grid" operator="in"/>
      <feMorphology operator="dilate" radius="7"/>
    </filter>
    <filter id="px-23" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feFlood x="11" y="11" width="1" height="1" result="dot"/>
      <feComposite in="dot" in2="dot" operator="over" x="0" y="0" width="23" height="23" result="cell"/>
      <feTile in="cell" result="grid"/>
      <feComposite in="SourceGraphic" in2="grid" operator="in"/>
      <feMorphology operator="dilate" radius="11"/>
    </filter>
    <filter id="px-33" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feFlood x="16" y="16" width="1" height="1" result="dot"/>
      <feComposite in="dot" in2="dot" operator="over" x="0" y="0" width="33" height="33" result="cell"/>
      <feTile in="cell" result="grid"/>
      <feComposite in="SourceGraphic" in2="grid" operator="in"/>
      <feMorphology operator="dilate" radius="16"/>
    </filter>
  </defs>
</svg>
<main class="stage">
  <section class="game sheet" aria-labelledby="px-h">
    <div class="pixelate-stack game-screen" id="px-views" data-pixelate aria-live="polite">
      <figure class="world is-current">
        <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="320" height="180" fill="#bfe3f2"/>
          <circle cx="262" cy="38" r="16" fill="#fff1b8"/>
          <path d="M0 120 C60 80 120 80 170 116 C210 90 270 88 320 112 V180 H0Z" fill="#7cbf7a"/>
          <rect y="146" width="320" height="34" fill="#8a6a4a"/><rect y="142" width="320" height="8" fill="#5aa257"/>
          <g fill="#3f7f45"><circle cx="60" cy="104" r="18"/><circle cx="84" cy="96" r="22"/><circle cx="230" cy="104" r="20"/></g>
          <g fill="#6b4a33"><rect x="70" y="112" width="8" height="32"/><rect x="226" y="116" width="8" height="28"/></g>
          <g fill="#f2c94c"><circle cx="140" cy="110" r="5"/><circle cx="156" cy="110" r="5"/><circle cx="172" cy="110" r="5"/></g>
        </svg>
        <figcaption><b>World 1</b> Hutan Hijau <span class="num">0/40</span></figcaption>
      </figure>
      <figure class="world">
        <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="320" height="180" fill="#f7d9a8"/>
          <circle cx="70" cy="44" r="22" fill="#fff4cf"/>
          <path d="M0 126 C70 100 120 104 190 128 C240 108 290 108 320 120 V180 H0Z" fill="#e6b26a"/>
          <path d="M0 152 C90 136 200 140 320 150 V180 H0Z" fill="#cf9550"/>
          <g fill="#5c8a52"><rect x="236" y="88" width="10" height="44" rx="5"/><rect x="224" y="98" width="8" height="18" rx="4"/><rect x="250" y="94" width="8" height="18" rx="4"/></g>
          <path d="M110 128 l24 -40 l24 40Z" fill="#c98a4a"/>
        </svg>
        <figcaption><b>World 2</b> Gurun Emas <span class="num">0/40</span></figcaption>
      </figure>
      <figure class="world">
        <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="320" height="180" fill="#2b3a6b"/>
          <g fill="#e9e6d6"><rect x="40" y="26" width="3" height="3"/><rect x="120" y="18" width="3" height="3"/><rect x="200" y="40" width="3" height="3"/><rect x="290" y="22" width="3" height="3"/></g>
          <circle cx="250" cy="50" r="14" fill="#f3efd8"/>
          <rect y="110" width="320" height="70" fill="#2f6fa8"/>
          <path d="M0 110 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="#4d8fc4"/>
          <path d="M120 110 h80 l-12 18 h-56Z" fill="#c4553b"/><path d="M160 110 V70 l26 34Z" fill="#f4f1ec"/>
        </svg>
        <figcaption><b>World 3</b> Laut Malam <span class="num">0/40</span></figcaption>
      </figure>
    </div>
    <div class="game-bar">
      <h1 id="px-h">Pick a world</h1>
      <button type="button" data-pixelate-go aria-controls="px-views">Next world</button>
    </div>
  </section>
</main>
</body>
</html>
