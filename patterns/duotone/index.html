<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duotone demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <figure class="shot sheet look-duotone-group" data-play>
    <div class="frame look-duotone look-duotone-cycle" role="img" aria-label="A person at a window seat with a red cup, a plant and a pendant lamp, a city skyline outside; the image maps to two colours and the pair changes slowly">
      <img src="scene.svg" alt="" width="320" height="240">
    </div>
    <figcaption class="shot-bar">
      <p><strong>Duotone</strong> <span class="mute">two colours, the pair changes</span></p>
      <span class="shot-end"><label class="look-duotone-pause switch"><input type="checkbox"> Pause</label></span>
    </figcaption>
  </figure>
</main>
