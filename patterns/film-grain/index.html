<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film grain demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="style.css">

<body>
<main class="stage">
  <figure class="shot sheet look-grain-group" data-play>
    <div class="frame look-grain" role="img" aria-label="A person at a window seat with a red cup, a plant and a pendant lamp, a city skyline outside; a fine moving film grain lies over the picture">
      <img src="scene.svg" alt="" width="320" height="240">
    </div>
    <figcaption class="shot-bar">
      <p><strong>Film grain</strong> <span class="mute">fine grain, new each frame</span></p>
      <span class="shot-end"><label class="look-grain-pause switch"><input type="checkbox"> Pause</label></span>
    </figcaption>
  </figure>
</main>
