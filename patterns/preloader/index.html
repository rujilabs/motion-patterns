<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preloader demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="preloader.js"></script>
<script src="demo.js" defer></script>
</head>
<body>
<div class="preloader" data-preloader="manual">
  <p class="pl-mark">Halden Studio</p>
  <p class="pl-count num"><span class="preloader-count">0</span><span class="pl-pct">%</span></p>
  <div class="preloader-bar" role="progressbar" aria-label="Loading the page" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
</div>
<main class="stage">
  <section class="studio sheet" aria-labelledby="studio-h">
    <header class="st-head preload-rise">
      <p class="st-mark">Halden Studio</p>
      <nav class="st-nav" aria-label="Studio"><span>Work</span><span>About</span><span>Contact</span></nav>
    </header>
    <h1 id="studio-h" class="preload-rise">Furniture and rooms for slow mornings.</h1>
    <ul class="works">
      <li class="work preload-rise">
        <svg viewBox="0 0 120 80" aria-hidden="true"><rect width="120" height="80" fill="#dce4ee"/><rect x="0" y="58" width="120" height="22" fill="#c7d2df"/><rect x="34" y="34" width="52" height="8" rx="2" fill="#7b5a43"/><rect x="38" y="42" width="4" height="18" fill="#7b5a43"/><rect x="78" y="42" width="4" height="18" fill="#7b5a43"/><circle cx="60" cy="27" r="6" fill="#f2f4f7"/></svg>
        <p><strong>Oak table</strong><span>Kitchen, 2026</span></p>
      </li>
      <li class="work preload-rise">
        <svg viewBox="0 0 120 80" aria-hidden="true"><rect width="120" height="80" fill="#e8e1d6"/><rect x="0" y="60" width="120" height="20" fill="#d6cbbb"/><path d="M40 60 V36 a20 20 0 0 1 40 0 V60Z" fill="#3d6a8c"/><rect x="36" y="56" width="48" height="6" rx="2" fill="#2c4f69"/></svg>
        <p><strong>Arch chair</strong><span>Reading room</span></p>
      </li>
      <li class="work preload-rise">
        <svg viewBox="0 0 120 80" aria-hidden="true"><rect width="120" height="80" fill="#dfe7e0"/><rect x="0" y="62" width="120" height="18" fill="#c9d6cb"/><rect x="56" y="14" width="2" height="30" fill="#5b6470"/><path d="M44 44 h26 l-6 -12 h-14Z" fill="#e3b04b"/><rect x="48" y="52" width="18" height="10" rx="2" fill="#5b6470"/></svg>
        <p><strong>Desk lamp</strong><span>Study, brass</span></p>
      </li>
    </ul>
    <button class="replay preload-rise" type="button">Load the page again</button>
  </section>
</main>
</body>
</html>
