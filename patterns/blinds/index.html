<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blinds transition demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="blinds.js"></script>
</head>
<body>
<main class="stage">
  <section class="flat sheet" aria-labelledby="bl-h">
    <div class="blinds-stack flat-screen" id="bl-views" data-blinds aria-live="polite">
      <figure class="room is-current">
        <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="320" height="180" fill="#efe8dc"/>
          <rect y="132" width="320" height="48" fill="#c9a983"/>
          <rect x="34" y="28" width="92" height="70" fill="#bfe0f7" stroke="#8a7a66" stroke-width="3"/>
          <path d="M80 28 V98 M34 63 H126" stroke="#8a7a66" stroke-width="2"/>
          <rect x="150" y="96" width="132" height="40" rx="6" fill="#5f7d8c"/>
          <rect x="150" y="80" width="132" height="22" rx="6" fill="#6f8fa0"/>
          <rect x="160" y="136" width="6" height="10" fill="#4a3f33"/><rect x="266" y="136" width="6" height="10" fill="#4a3f33"/>
          <rect x="196" y="86" width="26" height="16" rx="3" fill="#e9b949"/>
          <path d="M292 132 V70" stroke="#4a3f33" stroke-width="2"/><path d="M280 70 h24 l-6 -16 h-12Z" fill="#f4f1ec" stroke="#8a7a66"/>
        </svg>
        <figcaption><b>Living room</b><span>3.6 m by 4.2 m</span></figcaption>
      </figure>
      <figure class="room">
        <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="320" height="180" fill="#e6ece8"/>
          <rect y="112" width="320" height="68" fill="#d7ddd9"/>
          <rect x="0" y="104" width="320" height="10" fill="#8b9a92"/>
          <rect x="20" y="114" width="280" height="56" fill="#f4f6f4" stroke="#aab5ae"/>
          <path d="M113 114 V170 M206 114 V170" stroke="#aab5ae"/>
          <rect x="30" y="22" width="120" height="42" fill="#f4f6f4" stroke="#aab5ae"/><path d="M90 22 V64" stroke="#aab5ae"/>
          <rect x="196" y="20" width="88" height="62" fill="#c4dff2" stroke="#8b9a92" stroke-width="3"/>
          <path d="M60 104 v-14 h14 v14 M64 90 v-6 h6 v6" fill="#c4553b"/>
          <path d="M226 104 v-10 a8 8 0 0 1 16 0 v10" fill="#7a8c6a"/>
        </svg>
        <figcaption><b>Kitchen</b><span>Gas hob, fridge included</span></figcaption>
      </figure>
      <figure class="room">
        <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="320" height="180" fill="#f0b98f"/>
          <circle cx="226" cy="96" r="22" fill="#f9dc94"/>
          <path d="M0 110 h40 v-34 h22 v34 h18 v-52 h26 v52 h30 v-24 h20 v24 h164 V180 H0Z" fill="#9b6f62"/>
          <rect y="128" width="320" height="52" fill="#6d5a52"/>
          <path d="M0 128 H320 M0 140 H320" stroke="#f4f1ec" stroke-width="2"/>
          <path d="M20 128 V180 M60 128 V180 M100 128 V180 M140 128 V180 M180 128 V180 M220 128 V180 M260 128 V180 M300 128 V180" stroke="#f4f1ec" stroke-width="2"/>
          <path d="M262 128 v-18 a10 10 0 0 1 20 0 v18" fill="#5c7a52"/>
        </svg>
        <figcaption><b>Balcony</b><span>Faces west, evening sun</span></figcaption>
      </figure>
      <div class="blinds-cover" aria-hidden="true"></div>
    </div>
    <div class="flat-bar">
      <h1 id="bl-h">Unit 4B, studio flat</h1>
      <div class="flat-btns">
        <button type="button" data-blinds-go="open" aria-controls="bl-views">Slats open</button>
        <button type="button" data-blinds-go="turn" aria-controls="bl-views">Slats turn</button>
      </div>
      <label class="switch"><input type="checkbox" data-blinds-v aria-controls="bl-views"> Upright slats</label>
    </div>
  </section>
</main>
</body>
</html>
