<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panning shot demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <section class="shot sheet pan-group" aria-labelledby="shot-h">
    <header class="shot-head">
      <div>
        <h1 id="shot-h">Panning shot</h1>
        <p class="shot-sub">Following a rider along the park road</p>
      </div>
      <label class="pan-pause switch"><input type="checkbox"> Pause</label>
    </header>
    <div class="frame" role="img" aria-label="A cyclist in a red jersey rides to the right. The camera follows, so the rider stays sharp while the trees, fence and buildings behind streak sideways.">
      <svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <!-- the streak: blur along x only, none along y -->
          <filter id="pan-streak" x="-5%" y="0" width="110%" height="100%" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="14 0"/>
          </filter>
          <g id="pan-tile">
            <rect class="c-far" x="0" y="38" width="46" height="96"/>
            <rect class="c-far" x="52" y="58" width="34" height="76"/>
            <rect class="c-mid" x="150" y="48" width="40" height="86"/>
            <rect class="c-far" x="230" y="30" width="54" height="104"/>
            <g class="c-sky"><rect x="8" y="50" width="8" height="10"/><rect x="26" y="50" width="8" height="10"/><rect x="8" y="74" width="8" height="10"/><rect x="26" y="74" width="8" height="10"/><rect x="240" y="44" width="8" height="10"/><rect x="262" y="44" width="8" height="10"/><rect x="240" y="70" width="8" height="10"/><rect x="262" y="70" width="8" height="10"/><rect x="160" y="62" width="8" height="10"/><rect x="174" y="62" width="8" height="10"/></g>
            <g class="p-tree"><circle cx="110" cy="96" r="22"/><circle cx="128" cy="108" r="16"/><circle cx="208" cy="102" r="18"/><circle cx="302" cy="98" r="20"/></g>
            <g class="p-trunk"><rect x="108" y="112" width="4" height="24"/><rect x="206" y="116" width="4" height="20"/><rect x="300" y="114" width="4" height="22"/></g>
            <rect class="c-near" x="0" y="134" width="320" height="2"/>
            <g class="c-near"><rect x="10" y="118" width="3" height="18"/><rect x="50" y="118" width="3" height="18"/><rect x="90" y="118" width="3" height="18"/><rect x="130" y="118" width="3" height="18"/><rect x="170" y="118" width="3" height="18"/><rect x="210" y="118" width="3" height="18"/><rect x="250" y="118" width="3" height="18"/><rect x="290" y="118" width="3" height="18"/><rect x="0" y="122" width="320" height="2"/></g>
            <g class="c-accent"><rect x="70" y="146" width="18" height="2"/><rect x="190" y="146" width="18" height="2"/></g>
            <g class="c-mid"><rect x="20" y="188" width="30" height="2"/><rect x="140" y="184" width="22" height="2"/><rect x="250" y="190" width="34" height="2"/></g>
          </g>
        </defs>
        <rect class="c-sky" width="320" height="200"/>
        <rect class="c-ground" x="0" y="136" width="320" height="64"/>
        <g class="pan-sharp"><g class="pan-move"><use href="#pan-tile"/><use href="#pan-tile" x="320"/><use href="#pan-tile" x="640"/></g></g>
        <g class="pan-blur"><g class="pan-move"><use href="#pan-tile"/><use href="#pan-tile" x="320"/><use href="#pan-tile" x="640"/></g></g>
        <!-- the rider: sharp, riding in place while the world moves -->
        <g class="rider">
          <ellipse class="p-shadow" cx="160" cy="173" rx="46" ry="3"/>
          <g class="wheel"><circle class="p-tyre" cx="128" cy="150" r="20"/><path class="p-spoke" d="M128 130 V170 M108 150 H148 M114 136 L142 164 M142 136 L114 164"/></g>
          <g class="wheel"><circle class="p-tyre" cx="196" cy="150" r="20"/><path class="p-spoke" d="M196 130 V170 M176 150 H216 M182 136 L210 164 M210 136 L182 164"/></g>
          <path class="p-frame" d="M128 150 L152 150 L184 122 L148 122 L128 150 M152 150 L144 112 M184 122 L196 150 M182 114 L186 122"/>
          <path class="p-frame" d="M138 112 H150 M178 112 L190 110"/>
          <path class="p-leg" d="M146 108 L164 128 L152 150"/>
          <path class="p-leg2" d="M146 108 L158 132 L168 146"/>
          <path class="p-jersey" d="M144 110 C150 90 166 80 178 84 L186 98 L176 104 L170 96 C160 98 154 104 150 112 Z"/>
          <path class="p-arm" d="M174 88 L188 108"/>
          <circle class="p-skin" cx="184" cy="76" r="7"/>
          <path class="p-helmet" d="M176 74 C176 64 192 62 194 72 Z"/>
        </g>
      </svg>
      <span class="vf" aria-hidden="true"></span>
    </div>
    <div class="shot-foot">
      <span>Camera follows the rider</span>
      <span class="num">1/30 s while panning</span>
    </div>
  </section>
</main>
</body>
</html>
