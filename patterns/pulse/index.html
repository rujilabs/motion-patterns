<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse · motion-patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <ul class="status card" role="list" aria-label="Service status">
    <li class="live"><span class="pulse pulse-double" aria-hidden="true"></span><strong>Live now</strong><span class="note">128 watching</span></li>
    <li class="ok"><span class="pulse pulse-count" aria-hidden="true"></span><strong>All systems normal</strong><span class="note">Checked 1 min ago</span></li>
    <li class="warn"><span class="pulse pulse-count" aria-hidden="true"></span><strong>2 orders to review</strong><span class="note">New</span></li>
  </ul>
</main>
</body>
</html>
