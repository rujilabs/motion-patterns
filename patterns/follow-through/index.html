<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow-through demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
<script src="follow-through.js"></script>
</head>
<body>
<main class="stage">
  <section class="track sheet" data-follow aria-labelledby="track-h">
    <header class="track-head">
      <div>
        <h1 id="track-h">Your parcel is at the door</h1>
        <p class="track-sub">Order <span class="num">#4417</span>, delivered by Rizal at <span class="num">11:42</span></p>
      </div>
      <button class="again" type="button" data-follow-replay>Play again</button>
    </header>
    <div class="street" aria-hidden="true">
      <svg class="house" viewBox="0 0 100 90">
        <path d="M8 40 50 8l42 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M16 34v54h68V34" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="42" y="56" width="18" height="32" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="24" y="48" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="66" y="48" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <div class="van follow">
        <svg viewBox="0 -24 124 92" width="124" height="92">
          <g class="van-body follow-rock">
            <g class="aerial follow-part">
              <path d="M26 14V-16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="26" cy="-18" r="2.6" class="tip"/>
            </g>
            <path class="shell" d="M4 52V18a4 4 0 0 1 4-4h66a6 6 0 0 1 5 2.6L94 32h16a8 8 0 0 1 8 8v12Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path class="glass" d="M78 20h3l10 14H78Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            <path class="stripe" d="M4 38h70v6H4Z"/>
            <path d="M74 14v38" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="114" cy="42" r="2" class="lamp"/>
          </g>
          <g class="wheel follow-spin"><circle cx="28" cy="56" r="9" class="tyre"/><circle cx="28" cy="56" r="3.5" class="hub"/><path d="M28 48v4M28 60v4" class="spoke"/></g>
          <g class="wheel follow-spin"><circle cx="98" cy="56" r="9" class="tyre"/><circle cx="98" cy="56" r="3.5" class="hub"/><path d="M98 48v4M98 60v4" class="spoke"/></g>
        </svg>
      </div>
      <span class="ground"></span>
    </div>
  </section>
</main>
</body>
</html>
