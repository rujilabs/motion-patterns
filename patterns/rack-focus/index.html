<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rack focus demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <section class="shot sheet rack-group" aria-labelledby="shot-h">
    <header class="shot-head">
      <div>
        <h1 id="shot-h">Rack focus</h1>
        <p class="shot-sub">From the cup on the table to the shop across the road</p>
      </div>
      <label class="rack-pause switch"><input type="checkbox"> Pause</label>
    </header>
    <div class="frame rack" role="img" aria-label="A cup of coffee on a cafe table in front, a small bookshop across the road behind it. The focus moves from the cup to the shop and back.">
      <svg class="rack-far" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect class="c-sky" width="320" height="200"/>
        <rect class="c-far" x="0" y="34" width="74" height="120"/>
        <g class="c-sky"><rect x="12" y="50" width="16" height="20"/><rect x="40" y="50" width="16" height="20"/><rect x="12" y="84" width="16" height="20"/><rect x="40" y="84" width="16" height="20"/></g>
        <rect class="c-far" x="226" y="44" width="94" height="110"/>
        <g class="c-sky"><rect x="240" y="60" width="18" height="22"/><rect x="270" y="60" width="18" height="22"/><rect x="300" y="60" width="18" height="22"/><rect x="240" y="96" width="18" height="22"/><rect x="270" y="96" width="18" height="22"/></g>
        <rect class="c-mid" x="74" y="20" width="152" height="134"/>
        <rect class="c-paper" x="104" y="36" width="92" height="20" rx="2"/>
        <text class="sign-text" x="150" y="49" text-anchor="middle">KEDAI BUKU</text>
        <path class="c-accent" d="M74 66 H226 L218 82 H82 Z"/>
        <rect class="c-paper" x="86" y="92" width="70" height="50"/>
        <g class="c-far"><rect x="92" y="114" width="6" height="22"/><rect x="99" y="118" width="5" height="18"/><rect x="105" y="112" width="7" height="24"/><rect x="118" y="116" width="6" height="20"/><rect x="125" y="110" width="5" height="26"/><rect x="134" y="118" width="8" height="18"/><rect x="144" y="114" width="6" height="22"/></g>
        <rect class="c-ink" x="166" y="92" width="30" height="62"/>
        <rect class="c-warm" x="170" y="96" width="22" height="16"/>
        <circle class="c-ink" cx="210" cy="108" r="6"/>
        <path class="c-ink" d="M202 154 L204 120 Q210 114 216 120 L218 154 Z"/>
        <rect class="c-ground" x="0" y="154" width="320" height="46"/>
        <rect class="c-far" x="0" y="154" width="320" height="3"/>
      </svg>
      <svg class="rack-near" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect class="c-near" x="0" y="160" width="320" height="40"/>
        <rect class="c-ink" x="0" y="160" width="320" height="2" opacity=".35"/>
        <ellipse class="c-paper" cx="92" cy="162" rx="54" ry="8"/>
        <ellipse class="cup-line" cx="92" cy="162" rx="54" ry="8"/>
        <path class="handle" d="M126 112 C146 112 146 140 122 141"/>
        <path class="c-paper" d="M58 96 H126 L118 156 Q92 163 66 156 Z"/>
        <path class="cup-line" d="M58 96 H126 L118 156 Q92 163 66 156 Z"/>
        <ellipse class="c-paper" cx="92" cy="96" rx="34" ry="6"/>
        <ellipse class="c-ink" cx="92" cy="97" rx="30" ry="4"/>
      </svg>
      <span class="vf" aria-hidden="true"></span>
    </div>
    <div class="shot-foot">
      <span class="focus-scale" aria-hidden="true"><span class="num">0.5 m</span><span class="focus-track"><span class="focus-mark"></span></span><span class="num">12 m</span></span>
      <span class="num">50 mm, f/1.8</span>
    </div>
  </section>
</main>
</body>
</html>
