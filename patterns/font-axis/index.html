<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variable font axes demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../fonts/anybody-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
</head>
<body>
<main class="stage">
  <section class="spec axis-group sheet" aria-labelledby="sp-h">
    <header class="sp-head">
      <p class="sp-tag">Specimen 03</p>
      <label class="axis-pause switch"><input type="checkbox"> Pause</label>
    </header>
    <h1 id="sp-h" class="sp-word axis-ripple" aria-label="Harbour"><span aria-hidden="true">H</span><span aria-hidden="true">a</span><span aria-hidden="true">r</span><span aria-hidden="true">b</span><span aria-hidden="true">o</span><span aria-hidden="true">u</span><span aria-hidden="true">r</span></h1>
    <div class="sp-scale" aria-hidden="true"><span>wght 200</span><span class="sp-rule"></span><span>900</span></div>
    <ul class="sp-row">
      <li><a class="axis-hover" href="#menu">Menu</a></li>
      <li><a class="axis-hover" href="#bookings">Bookings</a></li>
      <li><a class="axis-hover" href="#visit">Visit</a></li>
    </ul>
    <p class="sp-note">Hover a link. This font has weight and width axes and no slant axis, so the slant setting is skipped and the word narrows as it gets heavier.</p>
  </section>
</main>
</body>
</html>
