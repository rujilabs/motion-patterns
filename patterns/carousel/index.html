<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carousel demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="carousel.js" defer></script>
</head>
<body>
<main class="stage">
  <section class="rooms sheet" aria-labelledby="rooms-h">
    <header class="rooms-head">
      <div>
        <h1 id="rooms-h">Rooms at Rumah Teduh</h1>
        <p class="mute">Four rooms around one garden</p>
      </div>
    </header>
    <div class="carousel" data-carousel role="region" aria-roledescription="carousel" aria-labelledby="rooms-h">
      <div class="carousel-track" tabindex="0">
        <article class="carousel-slide room" aria-roledescription="slide" aria-label="1 of 4">
          <svg class="room-art" viewBox="0 0 240 140" aria-hidden="true">
            <rect width="240" height="140" fill="#e9dfcf"/><rect y="104" width="240" height="36" fill="#b98e62"/>
            <rect x="26" y="22" width="58" height="56" fill="#cfe3e8"/><path d="M55 22v56M26 50h58" stroke="#fff" stroke-width="3" fill="none"/><path d="M26 22h58v56H26z" stroke="#8b6a48" stroke-width="2" fill="none"/>
            <rect x="110" y="78" width="104" height="34" rx="3" fill="#fbf8f2"/><rect x="110" y="70" width="34" height="14" rx="4" fill="#fff"/><rect x="110" y="92" width="104" height="20" fill="#6f8f7a"/><rect x="106" y="62" width="6" height="52" fill="#8b6a48"/>
            <circle cx="200" cy="40" r="10" fill="#f2c46b"/><path d="M200 50v28" stroke="#8b6a48" stroke-width="2"/>
          </svg>
          <h2>Garden room</h2><p class="num">Queen bed, opens to the garden <b>RM 180</b></p>
        </article>
        <article class="carousel-slide room" aria-roledescription="slide" aria-label="2 of 4">
          <svg class="room-art" viewBox="0 0 240 140" aria-hidden="true">
            <rect width="240" height="140" fill="#dfe4ea"/><rect y="104" width="240" height="36" fill="#8f9aa6"/>
            <path d="M0 0 L120 0 L0 46z" fill="#c6ced8"/><rect x="140" y="18" width="70" height="44" fill="#f7e2b8"/><path d="M175 18v44" stroke="#fff" stroke-width="3"/><path d="M140 18h70v44h-70z" stroke="#5f6b78" stroke-width="2" fill="none"/>
            <rect x="24" y="80" width="96" height="30" rx="3" fill="#f6f7f9"/><rect x="24" y="90" width="96" height="20" fill="#3f5f87"/><rect x="28" y="72" width="30" height="13" rx="4" fill="#fff"/>
            <rect x="150" y="84" width="40" height="22" fill="#5f6b78"/><rect x="164" y="70" width="12" height="14" fill="#7aa36c"/>
          </svg>
          <h2>Loft</h2><p class="num">Sloped ceiling, desk by the window <b>RM 210</b></p>
        </article>
        <article class="carousel-slide room" aria-roledescription="slide" aria-label="3 of 4">
          <svg class="room-art" viewBox="0 0 240 140" aria-hidden="true">
            <rect width="240" height="140" fill="#efe6dc"/><rect y="104" width="240" height="36" fill="#c99a78"/>
            <rect x="96" y="20" width="48" height="58" rx="24" fill="#d9e8e0"/><path d="M96 44a24 24 0 0 1 48 0v34H96z" stroke="#9a6f52" stroke-width="2" fill="none"/>
            <rect x="16" y="80" width="70" height="30" rx="3" fill="#fbf8f2"/><rect x="16" y="92" width="70" height="18" fill="#c4553b"/><rect x="20" y="72" width="24" height="12" rx="4" fill="#fff"/>
            <rect x="154" y="80" width="70" height="30" rx="3" fill="#fbf8f2"/><rect x="154" y="92" width="70" height="18" fill="#c4553b"/><rect x="196" y="72" width="24" height="12" rx="4" fill="#fff"/>
            <rect x="108" y="88" width="24" height="18" fill="#9a6f52"/>
          </svg>
          <h2>Twin room</h2><p class="num">Two single beds, arched window <b>RM 160</b></p>
        </article>
        <article class="carousel-slide room" aria-roledescription="slide" aria-label="4 of 4">
          <svg class="room-art" viewBox="0 0 240 140" aria-hidden="true">
            <rect width="240" height="140" fill="#e4e8dc"/><rect y="104" width="240" height="36" fill="#a58a63"/>
            <rect x="18" y="20" width="44" height="54" fill="#cfe0ea"/><rect x="70" y="20" width="44" height="54" fill="#cfe0ea"/><path d="M18 20h44v54H18zM70 20h44v54H70z" stroke="#6b5a40" stroke-width="2" fill="none"/>
            <rect x="128" y="76" width="96" height="34" rx="3" fill="#fbf8f2"/><rect x="128" y="90" width="96" height="20" fill="#d8a648"/><rect x="132" y="68" width="30" height="13" rx="4" fill="#fff"/><rect x="190" y="68" width="30" height="13" rx="4" fill="#fff"/>
            <rect x="30" y="86" width="60" height="22" rx="3" fill="#6b8f6e"/><rect x="26" y="80" width="68" height="10" rx="4" fill="#58785a"/>
          </svg>
          <h2>Family suite</h2><p class="num">King bed and a day bed, sleeps 4 <b>RM 290</b></p>
        </article>
      </div>
      <div class="carousel-nav">
        <button type="button" class="carousel-prev nav-btn" aria-label="Previous room"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13"/></svg></button>
        <div class="carousel-dots"></div>
        <button type="button" class="carousel-next nav-btn" aria-label="Next room"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L11 8 L6 13"/></svg></button>
      </div>
    </div>
  </section>
</main>
</body>
</html>
