<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heart burst demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="heart-burst.js" defer></script>
<script src="demo.js" defer></script>
</head>
<body>
<main class="stage">
<section class="frame hbd-frame" aria-labelledby="hbd-h">
  <article class="hbd-card">
    <div class="hbd-photo">
      <img src="rendang.svg" alt="Dark beef rendang on a white plate" width="320" height="200">
      <button class="hb hbd-save" type="button" aria-pressed="false" aria-label="Save recipe">
        <span class="hb-icon">
          <span class="hb-ring" aria-hidden="true"></span>
          <span class="hb-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <svg class="hb-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.2s-7.6-4.6-8.6-9.6C2.7 7 5 4.4 7.9 4.4c1.8 0 3.2 1 4.1 2.4.9-1.4 2.3-2.4 4.1-2.4 2.9 0 5.2 2.6 4.5 6.2-1 5-8.6 9.6-8.6 9.6z"/></svg>
        </span>
      </button>
    </div>
    <div class="hbd-body">
      <p class="hbd-from">Dapur Mak Teh, Kuala Kangsar</p>
      <h1 id="hbd-h">Rendang tok, the slow way</h1>
      <p class="hbd-meta"><span class="num">3 h 20 min</span> · serves <span class="num">6</span> · <span class="num" data-hbd-count>1,284</span> saves</p>
      <p class="hbd-status" role="status" data-hbd-status></p>
    </div>
  </article>
</section>
</main>
</body>
</html>
