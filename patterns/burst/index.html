<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burst demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <article class="note sheet" aria-labelledby="note-h">
    <header class="note-head">
      <span class="avatar" aria-hidden="true">AK</span>
      <div>
        <p class="who">Aida Karim</p>
        <p class="when">Shared a checklist, 2 h ago</p>
      </div>
    </header>
    <h1 id="note-h">Before the Saturday market</h1>
    <ul class="tasks">
      <li>
        <label class="task">
          <input type="checkbox" checked>
          <span class="box"><svg class="burst-pop" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="burst burst-confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span>
          <span class="label">Print the price cards</span>
        </label>
      </li>
      <li>
        <label class="task">
          <input type="checkbox">
          <span class="box"><svg class="burst-pop" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="burst burst-confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span>
          <span class="label">Pack the tent weights</span>
        </label>
      </li>
      <li>
        <label class="task">
          <input type="checkbox">
          <span class="box"><svg class="burst-pop" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="burst burst-confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span>
          <span class="label">Change for the float, <span class="num">RM 200</span> in small notes</span>
        </label>
      </li>
    </ul>
    <footer class="note-foot">
      <label class="like">
        <input type="checkbox" checked>
        <span class="heart"><svg class="burst-pop" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.2s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.6c0 5.4-7.5 10-7.5 10Z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="burst" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span>
        <span class="like-n num"><span class="n-off">23</span><span class="n-on">24</span> likes</span>
      </label>
      <span class="comments">3 comments</span>
    </footer>
  </article>
</main>
</body>
</html>
