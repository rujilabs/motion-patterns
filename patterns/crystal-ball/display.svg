<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ddd0"/>
      <stop offset="1" stop-color="#d9c6b4"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy=".3" r=".5">
      <stop offset="0" stop-color="#fff7ec" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff7ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3a2a"/>
      <stop offset="1" stop-color="#7a5038"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2219"/>
      <stop offset="1" stop-color="#22140f"/>
    </linearGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e2f3f"/>
      <stop offset=".45" stop-color="#b9606f"/>
      <stop offset="1" stop-color="#5a2433"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset=".5" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#cfd6dc"/>
      <stop offset="1" stop-color="#7f8a94"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wall)"/>
  <!-- wall panels and down lights -->
  <g fill="none" stroke="#cdb8a4" stroke-width="3">
    <rect x="40" y="40" width="220" height="300" rx="6"/>
    <rect x="290" y="40" width="220" height="300" rx="6"/>
    <rect x="540" y="40" width="220" height="300" rx="6"/>
  </g>
  <ellipse cx="150" cy="150" rx="150" ry="230" fill="url(#spot)"/>
  <ellipse cx="400" cy="150" rx="150" ry="230" fill="url(#spot)"/>
  <ellipse cx="650" cy="150" rx="150" ry="230" fill="url(#spot)"/>
  <!-- counter: top surface and front -->
  <path d="M0 380 H800 V470 H0 Z" fill="url(#top)"/>
  <rect y="378" width="800" height="4" fill="#a87a58"/>
  <rect y="470" width="800" height="6" fill="#c39a6b"/>
  <rect y="476" width="800" height="124" fill="url(#front)"/>
  <g stroke="#4a2c20" stroke-width="2">
    <path d="M200 478 V600 M400 478 V600 M600 478 V600"/>
  </g>
  <!-- ring stands: velvet cones, each with a ring and a numbered tag -->
  <g>
    <ellipse cx="100" cy="418" rx="44" ry="10" fill="#2e1a12" opacity=".5"/>
    <path d="M100 262 C108 262 112 268 113 280 L142 414 Q100 426 58 414 L87 280 C88 268 92 262 100 262 Z" fill="url(#velvet)"/>
    <ellipse cx="100" cy="292" rx="27" ry="9" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <path d="M100 262 l11 12 l-11 12 l-11 -12 Z" fill="url(#white)" stroke="#ffffff" stroke-width="1"/>
    <path d="M89 274 h22 M100 262 v24" stroke="#ffffff" stroke-width="1" opacity=".7"/>

    <ellipse cx="250" cy="420" rx="46" ry="10" fill="#2e1a12" opacity=".5"/>
    <path d="M250 232 C258 232 262 238 263 250 L294 416 Q250 428 206 416 L237 250 C238 238 242 232 250 232 Z" fill="url(#velvet)"/>
    <ellipse cx="250" cy="262" rx="28" ry="9" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <circle cx="250" cy="244" r="12" fill="#c0182f" stroke="url(#gold)" stroke-width="4"/>
    <circle cx="246" cy="240" r="3.5" fill="#ff8a96"/>

    <ellipse cx="400" cy="420" rx="46" ry="10" fill="#2e1a12" opacity=".5"/>
    <path d="M400 214 C408 214 412 220 413 232 L444 416 Q400 428 356 416 L387 232 C388 220 392 214 400 214 Z" fill="url(#velvet)"/>
    <ellipse cx="400" cy="244" rx="28" ry="9" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <rect x="389" y="214" width="22" height="18" rx="3" fill="#0f8a5f" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="378" cy="226" r="6" fill="url(#white)"/>
    <circle cx="422" cy="226" r="6" fill="url(#white)"/>
    <rect x="393" y="217" width="6" height="5" fill="#7fe0b8"/>

    <ellipse cx="550" cy="420" rx="46" ry="10" fill="#2e1a12" opacity=".5"/>
    <path d="M550 240 C558 240 562 246 563 258 L594 416 Q550 428 506 416 L537 258 C538 246 542 240 550 240 Z" fill="url(#velvet)"/>
    <ellipse cx="550" cy="270" rx="28" ry="9" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <ellipse cx="550" cy="252" rx="11" ry="14" fill="#1f4fb8" stroke="url(#white)" stroke-width="4"/>
    <ellipse cx="546" cy="246" rx="3" ry="4" fill="#9ec0ff"/>

    <ellipse cx="700" cy="418" rx="44" ry="10" fill="#2e1a12" opacity=".5"/>
    <path d="M700 270 C708 270 712 276 713 288 L742 414 Q700 426 658 414 L687 288 C688 276 692 270 700 270 Z" fill="url(#velvet)"/>
    <ellipse cx="700" cy="296" rx="27" ry="8" fill="none" stroke="url(#gold)" stroke-width="9"/>
    <path d="M675 292 q25 -6 50 0" fill="none" stroke="#fff6cf" stroke-width="2"/>
  </g>
  <g font-family="Georgia, serif" font-size="17" font-weight="700" text-anchor="middle" fill="#3b1f2b">
    <rect x="86" y="436" width="28" height="24" rx="4" fill="#f6efe6"/><text x="100" y="454">1</text>
    <rect x="236" y="436" width="28" height="24" rx="4" fill="#f6efe6"/><text x="250" y="454">2</text>
    <rect x="386" y="436" width="28" height="24" rx="4" fill="#f6efe6"/><text x="400" y="454">3</text>
    <rect x="536" y="436" width="28" height="24" rx="4" fill="#f6efe6"/><text x="550" y="454">4</text>
    <rect x="686" y="436" width="28" height="24" rx="4" fill="#f6efe6"/><text x="700" y="454">5</text>
  </g>
</svg>
