<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comet dial demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
<script src="comet-dial.js" defer></script>
<script src="demo.js" defer></script>
</head>
<body>
<main class="stage">
  <section class="oven sheet" aria-labelledby="oven-h">
    <header class="oven-head">
      <p class="shop">Dapur Kak Yah, Ipoh</p>
      <h1 id="oven-h">Oven 2, top rack</h1>
      <p class="mute">Roti boyan, 12 pieces at 180 °C. The recipe card says 18 minutes.</p>
    </header>
    <div class="comet-dial" id="dial" role="slider" tabindex="0" aria-label="Oven 2 timer, in minutes" aria-valuemin="0" aria-valuemax="60" aria-valuenow="18" aria-valuetext="18 minutes left" data-value="18" data-max="60">
      <canvas aria-hidden="true"></canvas>
      <span class="cd-read" aria-hidden="true"><span class="cd-time num">18:00</span><span class="cd-unit">left</span></span>
    </div>
    <div class="oven-controls">
      <button class="start" id="start" type="button" aria-pressed="false">Start</button>
      <label class="switch"><input type="checkbox" id="fast"> Demo speed, 30 times</label>
    </div>
    <p class="oven-status" role="status" id="status">It is 3:23 pm. Turn the dial or use the arrow keys, then Start.</p>
  </section>
</main>
</body>
</html>
