<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black and white demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <figure class="shot sheet" data-play>
    <div class="frame look-bw" role="img" aria-label="A person at a window seat with a red cup, a plant and a pendant lamp, a city skyline outside; the colour drains to black and white while the red cup keeps its colour">
      <img src="scene.svg" alt="" width="320" height="240">
      <img class="look-bw-keep" src="accent.svg" alt="" width="320" height="240">
    </div>
    <figcaption class="shot-bar">
      <p><strong>Black and white</strong> <span class="mute">colour drains; one accent held</span></p>
      <span class="shot-end"><label class="switch keep"><input type="checkbox" checked> Keep red</label></span>
    </figcaption>
  </figure>
</main>
</body>
</html>
