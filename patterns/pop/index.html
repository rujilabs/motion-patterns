<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pop · motion-patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <div class="pop-demo">
    <div class="product card">
      <div class="thumb" aria-hidden="true"></div>
      <div class="info">
        <p class="name">Linen tote</p>
        <p class="chips"><span class="chip pop">New</span><span class="chip chip-mint pop">Free shipping</span></p>
      </div>
      <a class="cart" href="#cart" aria-label="Cart, 2 items">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 7h14l-1.4 9.1a2 2 0 0 1-2 1.7H8.4a2 2 0 0 1-2-1.7L5 7Zm3 0a4 4 0 0 1 8 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="count pop">2</span>
      </a>
    </div>
    <button class="buy pop-press" type="button">Add to cart</button>
    <p class="label">Press and hold the button.</p>
  </div>
</main>
</body>
</html>
