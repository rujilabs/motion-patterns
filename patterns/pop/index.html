<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pop demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <div class="shop">
    <header class="bar">
      <p class="shopname">Tanah Studio</p>
      <a class="cart" href="#cart" aria-label="Cart, 2 items">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4.5 8h15l-1.3 10.2a1.5 1.5 0 0 1-1.5 1.3H7.3a1.5 1.5 0 0 1-1.5-1.3L4.5 8Zm4 0V7a3.5 3.5 0 0 1 7 0v1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span class="count pop num">2</span>
      </a>
    </header>
    <article class="item sheet" aria-labelledby="item-h">
      <div class="shot">
        <svg viewBox="0 0 200 160" role="img" aria-label="A speckled stoneware mug with a loop handle">
          <ellipse cx="100" cy="138" rx="58" ry="6" fill="currentColor" opacity=".08"/>
          <path d="M136 70 h10 a20 20 0 0 1 0 40 h-10" fill="none" stroke="#c9bfae" stroke-width="9"/>
          <path d="M58 46 h80 v76 a16 16 0 0 1 -16 16 h-48 a16 16 0 0 1 -16 -16 Z" fill="#ece5d8"/>
          <path d="M58 46 h80 v12 h-80 Z" fill="#7a8f7c"/>
          <g fill="#8c7f6c"><circle cx="72" cy="78" r="1.4"/><circle cx="90" cy="94" r="1.2"/><circle cx="112" cy="72" r="1.4"/><circle cx="124" cy="104" r="1.2"/><circle cx="80" cy="116" r="1.3"/><circle cx="104" cy="122" r="1.1"/><circle cx="98" cy="70" r="1"/><circle cx="128" cy="84" r="1"/><circle cx="68" cy="100" r="1"/></g>
          <ellipse cx="98" cy="46" rx="40" ry="5" fill="#5f7362"/>
        </svg>
        <p class="badges"><span class="badge badge-new pop">New</span><span class="badge pop">Ships tomorrow</span></p>
      </div>
      <div class="item-body">
        <div class="item-row">
          <h1 id="item-h">Speckled mug, sage rim</h1>
          <p class="price num">RM 48.00</p>
        </div>
        <p class="item-sub">Stoneware, 340 ml. Thrown in Ipoh.</p>
        <button class="buy pop-press" type="button">Add to cart</button>
      </div>
    </article>
  </div>
</main>
</body>
</html>
