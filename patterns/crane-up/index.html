<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crane up demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <figure class="shot sheet crane-up-group">
    <div class="frame crane-up" role="img" aria-label="At eye level a hedge hides a town square; the camera rises and tilts down to show the square from above, with a fountain and a red market stall">
      <div class="crane-up-rig">
        <div class="ground">
          <span class="path-ns"></span><span class="path-ew"></span>
          <span class="fountain"></span>
          <span class="stall s1"></span><span class="stall s2"></span><span class="stall s3 key"></span>
          <span class="bench b1"></span><span class="bench b2"></span>
        </div>
        <div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div>
        <div class="hedge"></div>
      </div>
      <span class="vf" aria-hidden="true"></span>
    </div>
    <figcaption class="shot-bar">
      <p><strong>Crane up</strong> <span class="mute">up over the hedge, looking down on the square</span></p>
      <label class="crane-up-pause switch"><input type="checkbox"> Pause</label>
    </figcaption>
  </figure>
</main>
</body>
</html>
