<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drift demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <section class="empty sheet" aria-labelledby="empty-h">
    <svg class="sky" viewBox="0 0 320 150" role="img" aria-label="A paper plane floating between two clouds">
      <path class="trail" d="M10 128 C 60 132, 84 100, 122 106 S 168 118, 186 92"/>
      <g class="drift drift-slow cloud"><path d="M34 74 a15 15 0 0 1 24 -14 a20 20 0 0 1 38 4 a13 13 0 0 1 4 26 h-62 a11 11 0 0 1 -4 -16 Z"/></g>
      <g class="drift drift-2 drift-slow cloud cloud-far"><path d="M246 36 a9 9 0 0 1 16 -7 a13 13 0 0 1 24 4 a8 8 0 0 1 2 16 h-40 a7 7 0 0 1 -2 -13 Z"/></g>
      <g class="drift drift-3 plane">
        <path class="plane-keel" d="M270 44 L222 92 L216 110 Z"/>
        <path class="plane-wing" d="M270 44 L184 88 L222 92 Z"/>
      </g>
    </svg>
    <h1 id="empty-h">You are all caught up</h1>
    <p class="empty-sub">No new messages since Friday. We will let you know when Aiman replies about the venue.</p>
    <button class="write" type="button">Write a message</button>
  </section>
</main>
</body>
</html>
