<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel trail demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="pixel-trail.js" defer></script>
</head>
<body>
<main class="stage">
<section class="px-trail ptd" aria-labelledby="ptd-h" data-px-cell="16" data-px-life="850">
  <canvas class="px-canvas" aria-hidden="true"></canvas>
  <div class="ptd-copy">
    <p class="ptd-name">Mesin Syiling, game cafe, SS15 Subang Jaya</p>
    <h1 id="ptd-h">48 arcade cabinets and a teh tarik bar.</h1>
    <p class="ptd-sub">Open 2:00 pm to 1:30 am. Unlimited play for 3 hours, <span class="num">RM 23.90</span>.</p>
    <p class="ptd-cta">
      <button type="button" class="ptd-btn">Book a table for Friday</button>
      <button type="button" class="ptd-link">See the 48 cabinets</button>
    </p>
    <p class="ptd-hint">Move across the screen, or Tab to a button</p>
  </div>
</section>
</main>
</body>
</html>
