<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll reveal · motion-patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="reveal-demo">
  <p class="label">Scroll inside this frame.</p>
  <section class="card reveal"><h2>One</h2><p>Each block rises as it enters the view.</p></section>
  <section class="card reveal"><h2>Two</h2><p>The motion is tied to scroll, not to time.</p></section>
  <section class="card reveal"><h2>Three</h2><p>Scroll back up and it plays in reverse.</p></section>
  <section class="card reveal"><h2>Four</h2><p>No script needed.</p></section>
  <section class="card reveal"><h2>Five</h2><p>Older browsers just show the blocks.</p></section>
</main>
</body>
</html>
