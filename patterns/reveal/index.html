<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll reveal · motion-patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<div class="reveal-progress" aria-hidden="true"></div>
<main class="reveal-demo">
  <header>
    <p class="label">Scroll inside this frame</p>
    <h1>How we roast</h1>
    <p class="lede">Every block below is tied to your scroll. Scroll back up and it plays in reverse.</p>
  </header>
  <figure class="shot reveal-parallax">
    <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Coffee beans spread on a tray"><rect width="400" height="240" fill="#6b4a32"/><g fill="#3a2516"><ellipse cx="60" cy="50" rx="16" ry="11"/><ellipse cx="140" cy="90" rx="16" ry="11"/><ellipse cx="230" cy="40" rx="16" ry="11"/><ellipse cx="320" cy="110" rx="16" ry="11"/><ellipse cx="90" cy="170" rx="16" ry="11"/><ellipse cx="200" cy="190" rx="16" ry="11"/><ellipse cx="300" cy="200" rx="16" ry="11"/><ellipse cx="360" cy="40" rx="16" ry="11"/><ellipse cx="30" cy="120" rx="16" ry="11"/></g></svg>
  </figure>
  <section class="card reveal"><h2>1. Green beans</h2><p>Sorted by hand, dried for three weeks.</p></section>
  <section class="card reveal"><h2>2. First crack</h2><p>At nine minutes the beans pop. We listen for it.</p></section>
  <figure class="shot reveal-clip">
    <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A cup of coffee on a wooden table"><rect width="400" height="200" fill="#e9d8c4"/><rect y="140" width="400" height="60" fill="#a8774f"/><path d="M160 90 h80 v40 a20 20 0 0 1 -20 20 h-40 a20 20 0 0 1 -20 -20 Z" fill="#fff"/><ellipse cx="200" cy="90" rx="40" ry="8" fill="#5a3a22"/><path d="M240 100 a14 14 0 0 1 0 26" fill="none" stroke="#fff" stroke-width="6"/></svg>
  </figure>
  <section class="card reveal"><h2>3. Rest</h2><p>Two days before it goes in a bag.</p></section>
</main>
</body>
</html>
