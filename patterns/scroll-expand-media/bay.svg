<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <title>Drawn view of a bay at dusk with water chalets on stilts</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a6b"/>
      <stop offset=".45" stop-color="#b8607a"/>
      <stop offset=".78" stop-color="#f3a35f"/>
      <stop offset="1" stop-color="#fcd58a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a46a"/>
      <stop offset=".18" stop-color="#7a6f93"/>
      <stop offset=".6" stop-color="#2f5a78"/>
      <stop offset="1" stop-color="#173a52"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff4d2"/>
      <stop offset=".55" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="620" fill="url(#sky)"/>
  <circle cx="1010" cy="560" r="150" fill="url(#sun)"/>
  <circle cx="1010" cy="572" r="58" fill="#fff1c9"/>
  <!-- far islands -->
  <path d="M0 600 L0 560 C90 540 160 500 240 505 C330 512 380 560 470 575 L560 600 Z" fill="#5d4f78"/>
  <path d="M1180 600 C1240 548 1300 512 1380 520 C1450 527 1500 560 1600 556 L1600 600 Z" fill="#4e466e"/>
  <path d="M640 600 C680 585 720 578 760 584 C790 589 805 596 820 600 Z" fill="#6b5b82"/>
  <rect y="600" width="1600" height="400" fill="url(#sea)"/>
  <!-- sun path on the water -->
  <g fill="#ffe2a1" opacity=".8">
    <rect x="975" y="612" width="70" height="4" rx="2"/>
    <rect x="955" y="632" width="110" height="4" rx="2"/>
    <rect x="985" y="652" width="54" height="4" rx="2"/>
    <rect x="940" y="676" width="140" height="5" rx="2.5"/>
    <rect x="970" y="704" width="84" height="5" rx="2.5"/>
    <rect x="925" y="738" width="170" height="6" rx="3"/>
    <rect x="980" y="776" width="66" height="6" rx="3"/>
  </g>
  <!-- jetty and water chalets -->
  <g fill="#1d2338">
    <rect x="330" y="712" width="900" height="10"/>
    <g id="leg"><rect x="0" y="722" width="7" height="58"/></g>
    <use href="#leg" x="350"/><use href="#leg" x="470"/><use href="#leg" x="590"/><use href="#leg" x="710"/><use href="#leg" x="830"/><use href="#leg" x="950"/><use href="#leg" x="1070"/><use href="#leg" x="1190"/>
    <g id="chalet">
      <rect x="400" y="650" width="120" height="64"/>
      <path d="M380 655 L460 590 L540 655 Z"/>
      <rect x="404" y="714" width="6" height="74"/><rect x="510" y="714" width="6" height="74"/>
    </g>
    <use href="#chalet" x="250"/>
    <use href="#chalet" x="500"/>
  </g>
  <g fill="#ffc96b">
    <rect x="440" y="672" width="16" height="22"/><rect x="468" y="672" width="16" height="22"/>
    <rect x="690" y="672" width="16" height="22"/><rect x="718" y="672" width="16" height="22"/>
    <rect x="968" y="672" width="16" height="22"/>
  </g>
  <!-- reflections of the chalet lights -->
  <g fill="#ffc96b" opacity=".35">
    <rect x="446" y="800" width="30" height="4" rx="2"/><rect x="696" y="806" width="30" height="4" rx="2"/><rect x="964" y="812" width="24" height="4" rx="2"/>
  </g>
  <!-- palm on the left shore -->
  <g fill="#141a2c">
    <path d="M0 1000 L0 860 C120 850 250 880 330 940 L380 1000 Z"/>
    <path d="M150 905 C160 760 190 620 250 470 L262 474 C206 624 178 764 170 906 Z"/>
    <path d="M254 470 C200 430 120 430 60 470 C130 448 196 452 254 478 Z"/>
    <path d="M254 470 C230 400 170 360 100 362 C170 380 216 418 250 478 Z"/>
    <path d="M256 470 C300 410 370 395 440 420 C370 418 310 438 262 480 Z"/>
    <path d="M256 472 C330 460 400 490 440 550 C390 506 330 488 262 482 Z"/>
    <path d="M254 474 C220 500 190 560 186 620 C206 562 230 516 262 484 Z"/>
  </g>
  <!-- birds -->
  <g fill="none" stroke="#2b2440" stroke-width="3" stroke-linecap="round">
    <path d="M1240 300 q12 -10 24 0 q12 -10 24 0"/>
    <path d="M1310 270 q9 -8 18 0 q9 -8 18 0"/>
  </g>
</svg>
