<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosshair guides demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="crosshair-guides.js" defer></script>
<script src="demo.js" defer></script>
</head>
<body>
<main class="stage">
<section class="chd sheet" aria-labelledby="chd-h">
  <header class="chd-head">
    <p class="chd-brand">Taman Seri Bayu, phase 2, Kuala Selangor</p>
    <h1 id="chd-h">Pick a bungalow lot</h1>
    <p class="chd-sub">Freehold, <span class="num">RM 118.50</span> per m². <span class="num">9</span> of <span class="num">12</span> lots open.</p>
  </header>
  <div class="chd-body">
    <div class="ch chd-map" tabindex="0" role="group" aria-roledescription="site plan" aria-label="Site plan, phase 2" aria-describedby="chd-keys" data-ch-width="240" data-ch-height="180" data-ch-start="108.6 43.2" data-ch-unit="m">
    <svg class="chd-plan" viewBox="0 0 240 180" aria-hidden="true">
      <rect class="chd-ground" x="0" y="0" width="240" height="180"/>
      <rect class="chd-road" x="0" y="80" width="240" height="16"/>
      <line class="chd-road-mark" x1="4" y1="88" x2="236" y2="88"/>
      <text class="chd-road-name" x="120" y="90.6">Jalan Bayu 3</text>
      <rect class="chd-green" x="213" y="10" width="20" height="66"/>
      <rect class="chd-green" x="162" y="100" width="71" height="70"/>
      <text class="chd-green-name" x="197.5" y="137">Playground</text>
      <rect class="ch-lot" data-lot="PT 101" x="10.0" y="10" width="27.4" height="66"/>
      <rect class="ch-lot" data-lot="PT 102" x="37.4" y="10" width="29.1" height="66"/>
      <rect class="ch-lot is-sold" data-lot="PT 103" x="66.5" y="10" width="28.6" height="66"/>
      <rect class="ch-lot is-hit" data-lot="PT 104" x="95.1" y="10" width="26.9" height="66"/>
      <rect class="ch-lot" data-lot="PT 105" x="122.0" y="10" width="30.2" height="66"/>
      <rect class="ch-lot is-sold" data-lot="PT 106" x="152.2" y="10" width="28.3" height="66"/>
      <rect class="ch-lot" data-lot="PT 107" x="180.5" y="10" width="29.5" height="66"/>
      <rect class="ch-lot" data-lot="PT 108" x="10.0" y="100" width="31.6" height="70"/>
      <rect class="ch-lot" data-lot="PT 109" x="41.6" y="100" width="28.8" height="70"/>
      <rect class="ch-lot is-sold" data-lot="PT 110" x="70.4" y="100" width="27.7" height="70"/>
      <rect class="ch-lot" data-lot="PT 111" x="98.1" y="100" width="29.9" height="70"/>
      <rect class="ch-lot" data-lot="PT 112" x="128.0" y="100" width="30.4" height="70"/>
      <g class="chd-num">
      <text x="23.70" y="45.0">101</text>
      <text x="51.95" y="45.0">102</text>
      <text x="80.80" y="45.0">103</text>
      <text x="108.55" y="45.0">104</text>
      <text x="137.10" y="45.0">105</text>
      <text x="166.35" y="45.0">106</text>
      <text x="195.25" y="45.0">107</text>
      <text x="25.80" y="137.0">108</text>
      <text x="56.00" y="137.0">109</text>
      <text x="84.25" y="137.0">110</text>
      <text x="113.05" y="137.0">111</text>
      <text x="143.20" y="137.0">112</text>
      </g>
      <g class="chd-ticks"><line x1="20" y1="0" x2="20" y2="3"/><line x1="40" y1="0" x2="40" y2="3"/><line x1="60" y1="0" x2="60" y2="3"/><line x1="80" y1="0" x2="80" y2="3"/><line x1="100" y1="0" x2="100" y2="3"/><line x1="120" y1="0" x2="120" y2="3"/><line x1="140" y1="0" x2="140" y2="3"/><line x1="160" y1="0" x2="160" y2="3"/><line x1="180" y1="0" x2="180" y2="3"/><line x1="200" y1="0" x2="200" y2="3"/><line x1="220" y1="0" x2="220" y2="3"/><line x1="0" y1="20" x2="3" y2="20"/><line x1="0" y1="40" x2="3" y2="40"/><line x1="0" y1="60" x2="3" y2="60"/><line x1="0" y1="80" x2="3" y2="80"/><line x1="0" y1="100" x2="3" y2="100"/><line x1="0" y1="120" x2="3" y2="120"/><line x1="0" y1="140" x2="3" y2="140"/><line x1="0" y1="160" x2="3" y2="160"/></g>
    </svg>
      <span class="ch-v" aria-hidden="true"></span>
      <span class="ch-h" aria-hidden="true"></span>
      <span class="ch-tag num" aria-hidden="true"></span>
    </div>
    <div class="chd-panel">
      <dl class="chd-facts">
        <div><dt>Lot</dt><dd id="f-lot">PT 104</dd></div>
        <div><dt>Size</dt><dd class="num" id="f-size">1,775.4 m²</dd></div>
        <div><dt>Price</dt><dd class="num" id="f-price">RM 210,385</dd></div>
        <div><dt>Status</dt><dd id="f-status">Open</dd></div>
      </dl>
      <p class="chd-keys" id="chd-keys">Arrow keys move 1 m, with Shift 10 m. Enter picks the lot.</p>
      <p class="chd-picked" id="picked" role="status">No lot picked yet.</p>
    </div>
  </div>
</section>
</main>
</body>
</html>
