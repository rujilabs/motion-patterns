<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper diorama build demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="../drift/style.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <article class="trip sheet" aria-labelledby="trip-h">
    <svg class="paper paper-demo" data-play viewBox="0 0 400 230" width="400" height="230" role="img" aria-label="A paper-cut scene: a low sun, two rows of hills striped with tea bushes, a small bungalow between two trees and a cloud">
      <defs>
        <filter id="paper-shadow" x="-10%" y="-20%" width="120%" height="150%">
          <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="rgb(60,40,20)" flood-opacity=".3" result="soft"/>
          <feDropShadow in="soft" dx="0" dy="1" stdDeviation="0" flood-color="rgb(60,40,20)" flood-opacity=".22"/>
        </filter>
        <filter id="paper-grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
      </defs>
      <rect class="layer" data-layer="0" width="400" height="230" fill="#f6e3c6"/>
      <circle class="layer" data-layer="1" cx="300" cy="78" r="30" fill="#ee7b45" filter="url(#paper-shadow)"/>
      <path class="layer" data-layer="2" d="M0 142 Q60 92 140 126 T290 108 T400 118 V230 H0Z" fill="#b6cf98" filter="url(#paper-shadow)"/>
      <g class="layer" data-layer="3" filter="url(#paper-shadow)">
        <path d="M0 170 Q90 124 190 162 T400 150 V230 H0Z" fill="#6ea56f"/>
        <path d="M14 178 Q100 144 196 176 T392 166 M10 192 Q104 160 200 190 T396 182 M8 206 Q110 178 210 204 T398 198" fill="none" stroke="#5a9160" stroke-width="3" stroke-linecap="round"/>
      </g>
      <g class="layer fold" data-layer="4" filter="url(#paper-shadow)">
        <rect x="172" y="128" width="62" height="40" fill="#fbf6ec"/>
        <path d="M164 130 L203 104 L242 130Z" fill="#b8473a"/>
        <rect x="196" y="146" width="14" height="22" fill="#6f4631"/>
        <rect x="178" y="138" width="11" height="10" fill="#8cbfd4"/>
        <rect x="217" y="138" width="11" height="10" fill="#8cbfd4"/>
      </g>
      <g class="layer fold" data-layer="5" filter="url(#paper-shadow)">
        <path d="M130 174 L146 118 L162 174Z" fill="#2f6a4c"/>
        <path d="M254 168 L268 126 L282 168Z" fill="#3b7a56"/>
      </g>
      <path class="layer" data-layer="6" d="M0 214 Q100 190 210 210 T400 204 V230 H0Z" fill="#2f5f45" filter="url(#paper-shadow)"/>
      <g class="paper-after"><g class="drift drift-slow" filter="url(#paper-shadow)"><path d="M62 62 a11 11 0 0 1 18 -9 a15 15 0 0 1 28 4 a9 9 0 0 1 2 18 h-46 a8 8 0 0 1 -2 -13Z" fill="#fffaf1"/></g></g>
      <rect class="grain" width="400" height="230" filter="url(#paper-grain)"/>
    </svg>
    <div class="trip-text">
      <h1 id="trip-h">Two nights above the tea fields</h1>
      <p class="trip-meta"><span>Brinchang, Cameron Highlands</span><span class="num">from RM 320 a night</span></p>
    </div>
  </article>
</main>
</body>
</html>
