<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilt-shift demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <section class="shot sheet tilt-group" aria-labelledby="shot-h">
    <header class="shot-head">
      <div>
        <h1 id="shot-h">Tilt-shift</h1>
        <p class="shot-sub">A town seen from the hill, made to look like a model</p>
      </div>
      <label class="tilt-pause switch"><input type="checkbox"> Pause</label>
    </header>
    <div class="frame" role="img" aria-label="A small town seen from above: rows of houses, trees and a road with cars. The top and bottom of the picture blur, so the town looks like a model, and the band of focus drifts up and down.">
      <div class="tilt-shift">
        <svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect class="t-field" width="320" height="200"/>
          <!-- far row -->
          <rect class="t-hill" x="0" y="0" width="320" height="34"/>
          <g class="t-tree"><circle cx="14" cy="34" r="7"/><circle cx="30" cy="30" r="6"/><circle cx="120" cy="32" r="7"/><circle cx="214" cy="30" r="6"/><circle cx="300" cy="33" r="7"/></g>
          <g transform="translate(40 30)"><rect class="t-wall" width="22" height="14"/><path class="t-roof" d="M-2 0 L11 -9 L24 0 Z"/></g>
          <g transform="translate(70 34)"><rect class="t-wall2" width="18" height="12"/><path class="t-roof2" d="M-2 0 L9 -8 L20 0 Z"/></g>
          <g transform="translate(140 30)"><rect class="t-wall" width="26" height="14"/><path class="t-roof" d="M-2 0 L13 -9 L28 0 Z"/></g>
          <g transform="translate(176 33)"><rect class="t-wall2" width="20" height="12"/><path class="t-roof" d="M-2 0 L10 -8 L22 0 Z"/></g>
          <g transform="translate(236 30)"><rect class="t-wall" width="24" height="14"/><path class="t-roof2" d="M-2 0 L12 -9 L26 0 Z"/></g>
          <g transform="translate(270 34)"><rect class="t-wall2" width="18" height="12"/><path class="t-roof" d="M-2 0 L9 -8 L20 0 Z"/></g>
          <!-- middle row -->
          <g transform="translate(8 66)"><rect class="t-wall" width="30" height="20"/><path class="t-roof" d="M-3 0 L15 -12 L33 0 Z"/><rect class="t-win" x="5" y="6" width="6" height="6"/><rect class="t-win" x="19" y="6" width="6" height="6"/></g>
          <g transform="translate(50 70)"><rect class="t-wall2" width="26" height="16"/><path class="t-roof2" d="M-3 0 L13 -11 L29 0 Z"/><rect class="t-win" x="10" y="5" width="6" height="6"/></g>
          <g class="t-tree"><circle cx="92" cy="78" r="10"/><circle cx="106" cy="82" r="7"/></g>
          <g transform="translate(118 64)"><rect class="t-wall" width="40" height="22"/><path class="t-roof" d="M-3 0 L20 -13 L43 0 Z"/><rect class="t-win" x="6" y="7" width="7" height="7"/><rect class="t-win" x="17" y="7" width="7" height="7"/><rect class="t-win" x="28" y="7" width="7" height="7"/></g>
          <g transform="translate(170 68)"><rect class="t-wall2" width="28" height="18"/><path class="t-roof" d="M-3 0 L14 -11 L31 0 Z"/><rect class="t-win" x="11" y="6" width="6" height="6"/></g>
          <g class="t-tree"><circle cx="214" cy="80" r="8"/></g>
          <g transform="translate(228 66)"><rect class="t-wall" width="34" height="20"/><path class="t-roof2" d="M-3 0 L17 -12 L37 0 Z"/><rect class="t-win" x="6" y="6" width="6" height="6"/><rect class="t-win" x="22" y="6" width="6" height="6"/></g>
          <g transform="translate(276 70)"><rect class="t-wall2" width="30" height="16"/><path class="t-roof" d="M-3 0 L15 -11 L33 0 Z"/></g>
          <!-- road -->
          <rect class="t-pave" x="0" y="88" width="320" height="6"/>
          <rect class="t-road" x="0" y="94" width="320" height="26"/>
          <path class="t-lane" d="M0 107 H320"/>
          <rect class="t-pave" x="0" y="120" width="320" height="6"/>
          <g class="car car-a"><rect class="t-car1" x="0" y="96" width="22" height="9" rx="2"/><rect class="t-glass" x="13" y="97.5" width="6" height="6" rx="1"/></g>
          <g class="car car-b"><rect class="t-car2" x="0" y="109" width="20" height="9" rx="2"/><rect class="t-glass" x="2" y="110.5" width="5" height="6" rx="1"/></g>
          <g class="car car-c"><rect class="t-bus" x="0" y="95.5" width="40" height="10" rx="2"/><path class="t-glassline" d="M4 98.5 H36"/></g>
          <!-- near row -->
          <g class="t-tree"><circle cx="20" cy="150" r="16"/><circle cx="292" cy="148" r="18"/></g>
          <g transform="translate(46 150)"><rect class="t-wall" width="60" height="40"/><path class="t-roof2" d="M-5 0 L30 -22 L65 0 Z"/><rect class="t-win" x="10" y="12" width="12" height="12"/><rect class="t-win" x="38" y="12" width="12" height="12"/><rect class="t-door" x="25" y="24" width="10" height="16"/></g>
          <g transform="translate(124 154)"><rect class="t-wall2" width="72" height="36"/><path class="t-roof" d="M-5 0 L36 -20 L77 0 Z"/><rect class="t-win" x="10" y="10" width="12" height="12"/><rect class="t-win" x="30" y="10" width="12" height="12"/><rect class="t-win" x="50" y="10" width="12" height="12"/></g>
          <g transform="translate(214 150)"><rect class="t-wall" width="54" height="40"/><path class="t-roof" d="M-5 0 L27 -22 L59 0 Z"/><rect class="t-win" x="8" y="12" width="12" height="12"/><rect class="t-door" x="32" y="22" width="10" height="18"/></g>
          <rect class="t-hedge" x="0" y="190" width="320" height="10"/>
        </svg>
      </div>
      <span class="vf" aria-hidden="true"></span>
    </div>
    <div class="shot-foot">
      <span>Focus band drifts up and down</span>
      <span class="num">24 mm, shift 8 deg</span>
    </div>
  </section>
</main>
</body>
</html>
