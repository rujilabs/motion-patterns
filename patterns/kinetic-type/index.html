<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetic type demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <section class="poster sheet kt" aria-labelledby="poster-h">
    <header class="poster-top">
      <p class="shop">Bengkel Roda Kecil</p>
      <label class="kt-pause switch"><input type="checkbox"> Pause</label>
    </header>
    <h1 id="poster-h" class="headline">
      <span class="line"><span class="kt-up kt-at-1">Small</span> <span class="kt-up kt-at-2">shop.</span></span>
      <span class="line"><span class="kt-slide kt-at-3">Honest</span> <span class="kt-slam kt-at-4 key">prices.</span></span>
      <span class="line"><span class="kt-up kt-at-6">We</span> <span class="kt-up kt-at-7">fix</span> <span class="kt-sr">bikes, brakes, gears and flats.</span><span class="kt-swap kt-at-8 swap" aria-hidden="true"><span>bikes.</span><span>brakes.</span><span>gears.</span><span>flats.</span></span></span>
    </h1>
    <footer class="poster-foot">
      <span>Jalan Kebun 12</span>
      <span class="num">Open 9 to 6, closed Mondays</span>
    </footer>
  </section>
</main>
</body>
</html>
