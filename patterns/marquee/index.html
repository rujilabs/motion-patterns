<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee · motion-patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="stage">
  <section class="marquee-group" aria-labelledby="mq-h">
    <div class="mq-head">
      <h1 id="mq-h">Stocked by</h1>
      <label class="marquee-pause"><input type="checkbox"> Pause</label>
    </div>
    <div class="marquee" role="region" tabindex="0" aria-label="Shops that stock us">
      <div class="marquee-track">
        <ul class="marquee-list">
          <li>Northwind</li><li>Kettle &amp; Co</li><li>Lumen</li><li>Harbor</li><li>Fieldnote</li><li>Orbit</li>
        </ul>
        <ul class="marquee-list" aria-hidden="true">
          <li>Northwind</li><li>Kettle &amp; Co</li><li>Lumen</li><li>Harbor</li><li>Fieldnote</li><li>Orbit</li>
        </ul>
      </div>
    </div>
    <div class="marquee marquee-reverse slow" aria-hidden="true">
      <div class="marquee-track">
        <ul class="marquee-list quiet"><li>Ceramics</li><li>Linen</li><li>Soap</li><li>Honey</li><li>Coffee</li><li>Paper</li></ul>
        <ul class="marquee-list quiet"><li>Ceramics</li><li>Linen</li><li>Soap</li><li>Honey</li><li>Coffee</li><li>Paper</li></ul>
      </div>
    </div>
  </section>
</main>
</body>
</html>
