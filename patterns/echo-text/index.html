<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo text demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
<script src="echo-text.js" defer></script>
</head>
<body>
<main class="stage">
<section class="frame et-frame" aria-labelledby="et-h">
  <header class="et-top">
    <p class="et-live"><span class="et-dot" aria-hidden="true"></span>On air</p>
    <p class="num">Kuala Terengganu, 7:42 am</p>
  </header>
  <div class="et-body">
    <p class="et-freq num">91.6 FM</p>
    <h1 id="et-h"><a class="echo" href="#home" data-echo="4">Angin Timur</a></h1>
    <p class="et-show">Now: Pagi Kopi with Kak Ros <span class="num">6:00 to 9:30 am</span></p>
  </div>
  <footer class="et-foot">
    <a class="et-listen" href="#listen">Listen live</a>
    <p class="num">2,317 listening now</p>
  </footer>
</section>
</main>
</body>
</html>
