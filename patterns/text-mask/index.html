<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text mask demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../fonts/anybody-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
</head>
<body>
<main class="stage">
  <section class="ferry mask-group sheet" aria-labelledby="fr-h">
    <header class="fr-head">
      <p class="fr-tag">Jetty 2, Kuala Teluk</p>
      <label class="mask-pause switch"><input type="checkbox"> Pause</label>
    </header>
    <h1 id="fr-h" class="fr-word text-mask">ISLAND</h1>
    <dl class="fr-times">
      <div><dt>Next ferry</dt><dd class="num">10:40</dd></div>
      <div><dt>Crossing</dt><dd class="num">35 min</dd></div>
      <div><dt>Sea</dt><dd class="calm">Calm</dd></div>
    </dl>
  </section>
</main>
</body>
</html>
