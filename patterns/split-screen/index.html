<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split screen demo, motion patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../../fonts/host-grotesk-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../demo.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="page.css">
</head>
<body>
<main class="stage">
  <section class="split-group clock sheet" aria-labelledby="sp-h">
    <div class="split clock-screen" role="group" aria-label="Three cities at the same minute">
      <figure class="city">
        <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="320" height="180" fill="#1d2440"/>
          <g fill="#e9e6d6"><circle cx="40" cy="30" r="1.2"/><circle cx="110" cy="18" r="1"/><circle cx="214" cy="26" r="1.2"/><circle cx="286" cy="40" r="1"/></g>
          <path d="M0 180 V130 h30 v-26 h22 v26 h18 v-40 h20 v40 h40 V180Z M190 180 V120 h24 v-30 h20 v30 h26 v20 h30 v-14 h30 V180Z" fill="#2a3560"/>
          <path d="M146 180 V58 l6 -16 h16 l6 16 V180Z M150 70 h20 M150 90 h20 M150 110 h20 M150 130 h20" fill="#3a4a80" stroke="#ffcf6a" stroke-width="2"/>
          <path d="M160 42 V20" stroke="#e9e6d6" stroke-width="2"/>
        </svg>
        <figcaption><b>Kuala Lumpur</b> <span class="num">20:00</span></figcaption>
      </figure>
      <figure class="city">
        <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="320" height="180" fill="#bfe0f7"/>
          <circle cx="160" cy="40" r="18" fill="#fff1b8"/>
          <rect y="140" width="320" height="40" fill="#5aa0cf"/>
          <path d="M0 140 V112 h40 v-14 h36 v42Z M240 140 V100 h34 v-12 h46 V140Z" fill="#e9c7a6"/>
          <path d="M96 140 V96 h128 V140" fill="#f4ece0"/><path d="M90 96 l70 -30 l70 30Z" fill="#c4553b"/>
          <g fill="#5f7d8c"><rect x="112" y="108" width="14" height="18"/><rect x="153" y="108" width="14" height="32"/><rect x="194" y="108" width="14" height="18"/></g>
        </svg>
        <figcaption><b>Lisbon</b> <span class="num">13:00</span></figcaption>
      </figure>
      <figure class="city">
        <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="320" height="180" fill="#f3c8a6"/>
          <circle cx="160" cy="112" r="26" fill="#fbe2a0"/>
          <path d="M0 120 L70 76 L120 108 L160 70 L210 112 L260 82 L320 116 V180 H0Z" fill="#b98a7a"/>
          <path d="M0 146 C80 132 220 136 320 146 V180 H0Z" fill="#8f6a64"/>
          <path d="M148 146 V128 h24 v18" fill="#f4ece0"/><path d="M144 128 l16 -10 l16 10Z" fill="#6b4a3f"/>
        </svg>
        <figcaption><b>Lima</b> <span class="num">07:00</span></figcaption>
      </figure>
    </div>
    <div class="clock-bar">
      <h1 id="sp-h">Same minute</h1>
      <fieldset class="seg">
        <legend class="sr">Panels</legend>
        <label><input type="radio" name="sp-n" class="split-to-1" checked> One</label>
        <label><input type="radio" name="sp-n" class="split-to-2"> Two</label>
        <label><input type="radio" name="sp-n" class="split-to-3"> Three</label>
      </fieldset>
    </div>
  </section>
</main>
</body>
</html>
