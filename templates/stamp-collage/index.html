<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stamp collage · motion-patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../patterns/stamp/style.css">
<link rel="stylesheet" href="../../patterns/pop/style.css">
<link rel="stylesheet" href="../../patterns/pulse/style.css">
<link rel="stylesheet" href="../../patterns/drift/style.css">
<link rel="stylesheet" href="style.css">
<script src="../../play.js"></script>
</head>
<body>
<main class="board">
  <header class="intro">
    <p class="open"><span class="pulse" aria-hidden="true"></span> Open now, until 6 pm</p>
    <h1>Corner Bakery</h1>
    <p class="lede">Baked at four, gone by noon. Here is what came out of the oven today.</p>
  </header>
  <ul class="scraps">
    <li class="scrap stamp tilt-l s1"><span class="name">Sourdough loaf</span><span class="note">72 hour ferment</span><span class="price pop p1"><span class="sr-only">Price </span>8.50</span></li>
    <li class="scrap scrap-warm stamp tilt-r s2"><span class="name">Butter croissant</span><span class="note">Laminated twice</span><span class="price pop p2"><span class="sr-only">Price </span>4.20</span></li>
    <li class="scrap scrap-mint stamp tilt-s s3"><span class="name">Pandan roll</span><span class="note">Weekend only</span><span class="sold stamp-ink" role="status">Sold out</span><span class="price pop p3"><span class="sr-only">Price </span>5.00</span></li>
    <li class="scrap scrap-blue stamp tilt-l s4"><span class="name">Rye crackers</span><span class="note">Seeded, salty</span><span class="price pop p4"><span class="sr-only">Price </span>6.00</span></li>
  </ul>
  <div class="crumbs" aria-hidden="true">
    <svg class="crumb drift drift-slow" viewBox="0 0 80 80"><circle cx="40" cy="40" r="30" fill="#f4c542"/></svg>
    <svg class="crumb crumb-2 drift drift-2" viewBox="0 0 80 80"><path d="M40 8 L48 32 L72 40 L48 48 L40 72 L32 48 L8 40 L32 32 Z" fill="#e2785a"/></svg>
  </div>
</main>
</body>
</html>
