<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper diorama hero · motion-patterns</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../patterns/paper/style.css">
<link rel="stylesheet" href="../../patterns/drift/style.css">
<link rel="stylesheet" href="../../patterns/pop/style.css">
<link rel="stylesheet" href="style.css">
<script src="../../play.js"></script>
</head>
<body>
<header class="hero">
  <svg class="paper scene" data-play viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <filter id="pd-shadow" x="-10%" y="-20%" width="120%" height="150%">
        <feDropShadow dx="0" dy="6" stdDeviation="3" flood-color="rgb(70,45,20)" flood-opacity=".32" result="soft"/>
        <feDropShadow in="soft" dx="0" dy="1" stdDeviation="0" flood-color="rgb(70,45,20)" flood-opacity=".25"/>
      </filter>
      <filter id="pd-grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
      <linearGradient id="pd-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd2a1"/><stop offset=".7" stop-color="#fff1dc"/></linearGradient>
    </defs>
    <rect class="layer" data-layer="0" width="1200" height="700" fill="url(#pd-sky)"/>
    <circle class="layer" data-layer="1" cx="905" cy="230" r="92" fill="#f2874a" filter="url(#pd-shadow)"/>
    <path class="layer" data-layer="2" d="M0 420 L170 300 L300 380 L470 250 L640 370 L800 290 L980 380 L1120 300 L1200 340 V700 H0Z" fill="#cfdcc2" filter="url(#pd-shadow)"/>
    <path class="layer" data-layer="3" d="M0 470 Q180 380 380 450 T760 430 T1200 420 V700 H0Z" fill="#a8c79d" filter="url(#pd-shadow)"/>
    <path class="layer" data-layer="4" d="M0 530 Q240 450 520 520 T1200 500 V700 H0Z" fill="#82b086" filter="url(#pd-shadow)"/>
    <g class="layer" data-layer="5" filter="url(#pd-shadow)">
      <rect x="700" y="420" width="150" height="100" fill="#f7efe1"/>
      <path d="M684 424 L775 352 L866 424Z" fill="#c4553b"/>
      <rect x="760" y="462" width="30" height="58" fill="#7a4b33"/>
      <rect x="716" y="444" width="28" height="24" fill="#8fc1d6"/>
      <rect x="806" y="444" width="28" height="24" fill="#8fc1d6"/>
    </g>
    <g class="layer" data-layer="6" filter="url(#pd-shadow)">
      <path d="M560 530 L590 440 L620 530Z" fill="#3f7a5a"/>
      <path d="M900 520 L928 430 L956 520Z" fill="#3f7a5a"/>
      <path d="M950 530 L984 418 L1018 530Z" fill="#2f6449"/>
    </g>
    <path class="layer" data-layer="7" d="M480 700 Q620 610 760 600 Q860 594 900 560 Q860 610 760 640 Q640 680 640 700Z" fill="#9fd0e0" filter="url(#pd-shadow)"/>
    <path class="layer" data-layer="8" d="M0 620 Q200 570 420 610 T880 620 T1200 600 V700 H0Z" fill="#4c8a62" filter="url(#pd-shadow)"/>
    <g class="layer" data-layer="9">
      <g class="drift">
        <path d="M640 190 q14 -12 28 0 q14 -12 28 0" fill="none" stroke="#5a4636" stroke-width="4" stroke-linecap="round"/>
        <path d="M712 160 q10 -9 20 0 q10 -9 20 0" fill="none" stroke="#5a4636" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
    <rect class="grain" width="1200" height="700" filter="url(#pd-grain)"/>
  </svg>

  <div class="copy">
    <p class="eyebrow">Hillside Stay</p>
    <h1>A slow weekend,<br>up the hill.</h1>
    <p class="lede">Three rooms, one garden, no traffic. Book the whole house for the family.</p>
    <a class="cta" href="#dates">Check dates <span class="tag pop">3 rooms left</span></a>
  </div>
</header>
</body>
</html>
